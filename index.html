<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="佛牌殿">
<title>佛牌殿 POS系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://roxwskdpnsctoaflcomt.supabase.co" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --gold: #d4a843;
  --gold-light: #e8c97a;
  --gold-pale: #f5e9c8;
  --deep: #1a0a2e;
  --deep2: #2d1a4a;
  --deep3: #3d2560;
  --surface: #f8f5f0;
  --surface2: #efe9de;
  --white: #ffffff;
  --text: #1a0a2e;
  --text2: #6b5c7e;
  --text3: #9a8aab;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(26,10,46,0.12);
  --shadow-lg: 0 8px 32px rgba(26,10,46,0.18);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; background: var(--deep); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--surface); position: relative; overflow: hidden; }

/* TOP BAR */
.topbar { background: var(--deep); padding: 44px 20px 16px; flex-shrink: 0; }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; }
.topbar-title { font-family: 'Noto Serif TC', serif; font-size: 18px; color: var(--gold-light); font-weight: 600; letter-spacing: 1px; }
.topbar-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.topbar-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* TAB BAR */
.tabbar { background: var(--deep); display: flex; overflow-x: auto; padding: 0 12px 14px; gap: 6px; flex-shrink: 0; scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: none; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.tab.active { background: var(--gold); color: var(--deep); font-weight: 500; }
.tab:not(.active) { background: rgba(255,255,255,0.07); color: var(--text3); }

/* SCROLL CONTENT */
.content { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: rgba(26,10,46,0.25) transparent; -webkit-overflow-scrolling: touch; }
.content::-webkit-scrollbar { display: block; width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: rgba(26,10,46,0.25); border-radius: 3px; }
.content::-webkit-scrollbar-thumb:hover { background: rgba(26,10,46,0.4); }

/* PAGES */
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* SECTION TITLE */
.sec { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin: 16px 0 10px; }
.sec:first-child { margin-top: 0; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.stat-card { background: var(--white); border-radius: var(--radius); padding: 14px; border: 1px solid rgba(26,10,46,0.06); }
.stat-card.accent { background: var(--deep); }
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.stat-card.accent .stat-label { color: rgba(255,255,255,0.5); }
.stat-val { font-size: 22px; font-weight: 500; color: var(--text); font-family: 'Noto Serif TC', serif; }
.stat-card.accent .stat-val { color: var(--gold-light); }
.stat-tag { font-size: 11px; margin-top: 4px; }
.tag-up { color: #2d7a4a; }
.tag-down { color: #c0392b; }
.tag-warn { color: #d4870a; }

/* ORDER CARD */
.order-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); cursor: pointer; transition: all 0.15s; }
.order-card:active { transform: scale(0.98); }
.order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.order-name { font-size: 15px; font-weight: 500; color: var(--text); }
.order-id { font-size: 11px; color: var(--text3); margin-top: 1px; }
.order-info { font-size: 12px; color: var(--text2); margin-bottom: 6px; line-height: 1.6; }
.order-items-text { font-size: 13px; color: var(--text); }
.alert-pill { display: inline-flex; align-items: center; gap: 4px; background: #fff0eb; color: #c0392b; font-size: 11px; padding: 4px 8px; border-radius: 6px; margin-top: 8px; }

/* BADGES */
.badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.b-ship { background: #e8f4fb; color: #1a6fa8; }
.b-pick { background: #fef3e2; color: #a06010; }
.b-done { background: #e8f5e9; color: #2d7a4a; }
.b-chain { background: #fce4ec; color: #a0294a; }
.b-cancel { background: #fce4e4; color: #c0392b; }
.b-return { background: #f3e8ff; color: #6b35a0; }

/* FILTER CHIPS */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(26,10,46,0.15); background: var(--white); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.chip.on { background: var(--deep); color: var(--gold-light); border-color: var(--deep); }

/* FORMS */
.form-block { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; font-weight: 500; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 11px 14px; border: 1px solid rgba(26,10,46,0.15); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Noto Sans TC', sans-serif; background: var(--white); color: var(--text); outline: none; transition: border 0.2s; -webkit-appearance: none; appearance: none; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-textarea { resize: none; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* BUTTONS */
.btn { padding: 13px 20px; border-radius: var(--radius); font-size: 15px; font-family: 'Noto Sans TC', sans-serif; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--deep); color: var(--gold-light); width: 100%; margin-top: 8px; }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-gold { background: var(--gold); color: var(--deep); width: 100%; margin-top: 8px; }
.btn-sm { padding: 7px 14px; font-size: 13px; border-radius: var(--radius-sm); }

/* PRODUCT CARD */
.product-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); display: flex; gap: 12px; cursor: pointer; transition: all 0.15s; }
.product-card:active { transform: scale(0.98); }
.product-img { width: 58px; height: 58px; border-radius: 10px; background: linear-gradient(135deg, var(--deep), var(--deep3)); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; }
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.product-meta { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.product-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ptag { font-size: 11px; padding: 2px 7px; border-radius: 4px; }
.ptag-effect { background: #ede8f8; color: #4a2580; }
.ptag-pos { background: #e8f5e9; color: #1a5a2e; }
.ptag-neg { background: #1a0a2e; color: #e8c97a; }
.price-tag { font-size: 14px; font-weight: 500; color: var(--deep); margin-top: 6px; }
.stock-tag { font-size: 12px; color: var(--text3); }
.stock-low { color: #c0392b; font-weight: 500; }

/* CUSTOMER CARD */
.customer-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); cursor: pointer; }
.customer-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--deep2); color: var(--gold-light); display: flex; align-items: center; justify-content: center; font-size: 15px; font-family: 'Noto Serif TC', serif; flex-shrink: 0; }
.customer-stat { text-align: center; }
.customer-stat-val { font-size: 18px; font-weight: 500; color: var(--text); font-family: 'Noto Serif TC', serif; }
.customer-stat-label { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* CHART */
.chart-wrap { background: var(--white); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { width: 100%; border-radius: 5px 5px 0 0; background: var(--surface2); min-height: 4px; transition: height 0.6s; }
.bar.curr { background: var(--gold); }
.bar-lbl { font-size: 10px; color: var(--text3); }
.bar-val-t { font-size: 10px; font-weight: 500; color: var(--text2); }
.bar-val-t.curr { color: var(--gold); }

/* RANKING */
.rank-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(26,10,46,0.06); }
.rank-num { width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; }
.rank-num.r1 { background: var(--gold); color: var(--deep); }
.rank-name { flex: 1; font-size: 13px; color: var(--text); }
.rank-sales { font-size: 13px; font-weight: 500; color: var(--text); }

/* SOURCE PIE LEGEND */
.source-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.source-item { display: flex; align-items: center; gap: 8px; }
.source-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.source-name { font-size: 12px; color: var(--text2); flex: 1; }
.source-pct { font-size: 12px; font-weight: 500; color: var(--text); }

/* MODAL OVERLAY */
.modal-overlay { position: absolute; inset: 0; background: rgba(10,4,20,0.6); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet { background: var(--white); border-radius: 20px 20px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.25s; position: relative; }
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 44px; height: 5px; border-radius: 3px; background: rgba(26,10,46,0.18); margin: 0 auto 16px; cursor: grab; position: relative; }
.modal-handle::after { content:''; position:absolute; left:-30px; right:-30px; top:-14px; bottom:-14px; }
.modal-close-x { position: absolute; top: 14px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface); color: var(--text2); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; }
.modal-title { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 16px; }

/* TOAST */
.toast { position: absolute; top: 100px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--deep); color: var(--gold-light); padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 200; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* SEARCH BAR */
.search-bar { position: relative; margin-bottom: 14px; }
.search-bar input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid rgba(26,10,46,0.15); border-radius: 10px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif; background: var(--white); color: var(--text); outline: none; }
.search-bar input:focus { border-color: var(--gold); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
.search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text3); cursor: pointer; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(26,10,46,0.08); }

/* FAB */
.fab { position: absolute; bottom: 80px; right: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--gold); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 16px rgba(212,168,67,0.4); z-index: 50; transition: all 0.2s; }
.fab:active { transform: scale(0.92); }

/* DIVIDER */
.divider { height: 1px; background: rgba(26,10,46,0.08); margin: 12px 0; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-state .emoji { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* PRODUCT DETAIL ROWS */
.detail-row { display: flex; padding: 9px 0; border-bottom: 1px solid rgba(26,10,46,0.06); }
.detail-key { font-size: 13px; color: var(--text3); width: 90px; flex-shrink: 0; }
.detail-val { font-size: 13px; color: var(--text); flex: 1; }

/* PHOTO UPLOAD */
.photo-upload { width: 80px; height: 80px; border-radius: 10px; border: 1.5px dashed rgba(26,10,46,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; background: var(--surface); }
.photo-preview { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; cursor: pointer; }

.budget-slider-wrap::before { content: ''; position: absolute; left: 0; right: 0; top: 14px; height: 4px; background: rgba(26,10,46,0.15); border-radius: 2px; }
.budget-slider-wrap input[type=range] { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 32px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; pointer-events: none; }
.budget-slider-wrap input[type=range]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
.budget-slider-wrap input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: all; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2px solid var(--deep); cursor: pointer; margin-top: 7px; }
.budget-slider-wrap input[type=range]::-moz-range-track { height: 4px; background: transparent; }
.budget-slider-wrap input[type=range]::-moz-range-thumb { pointer-events: all; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2px solid var(--deep); cursor: pointer; }

/* STATUS FILTER ROW */
.status-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; scrollbar-width: none; }
.status-row::-webkit-scrollbar { display: none; }

/* SWITCH */
.switch { display: flex; background: var(--surface2); border-radius: 8px; padding: 3px; gap: 3px; }
.switch-opt { flex: 1; padding: 6px; border-radius: 6px; border: none; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; background: none; color: var(--text2); transition: all 0.15s; text-align: center; }
.switch-opt.on { background: var(--deep); color: var(--gold-light); font-weight: 500; }

/* v1.2.0：庫存 +/-、可編輯詳情列、左滑刪除 */
.dr-edit{cursor:pointer;align-items:flex-start;}
.dr-edit:active{background:rgba(212,168,67,0.08);}
.dr-pen{color:var(--text3);font-size:12px;margin-left:6px;opacity:.7;flex-shrink:0;}
.stk-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(26,10,46,0.15);background:var(--white);font-size:20px;line-height:1;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;}
.stk-btn:active{background:var(--gold-pale);}
.stk-input{width:64px;text-align:center;height:38px;border:1px solid rgba(26,10,46,0.15);border-radius:8px;font-size:16px;font-family:inherit;background:var(--white);color:var(--text);}
.swipe-wrap{position:relative;margin-bottom:10px;border-radius:var(--radius);overflow:hidden;}
.swipe-wrap .product-card{margin-bottom:0;position:relative;transition:transform .2s ease;touch-action:pan-y;}
.swipe-wrap .product-card:active{transform:none;}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:84px;background:#c0392b;color:#fff;border:none;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit;}
.photo-uploading{width:80px;height:80px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);}
.ml-icon-btn{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;background:rgba(26,10,46,0.07);color:var(--text2);font-size:13px;flex-shrink:0;}

/* v1.3.0：多選下拉選單、重設預算 */
.ms-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border:1.5px solid rgba(26,10,46,0.15);border-radius:var(--radius-sm);background:var(--white);font-size:14px;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;}
.ms-btn.open{border-color:var(--gold);}
.ms-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-arrow{color:var(--text3);font-size:12px;transition:transform .2s;flex-shrink:0;}
.ms-btn.open .ms-arrow{transform:rotate(180deg);}
.ms-panel{margin-top:6px;border:1px solid rgba(26,10,46,0.12);border-radius:var(--radius-sm);background:var(--white);padding:8px;box-shadow:var(--shadow);}
.ms-list{max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ms-opt{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(26,10,46,0.05);font-size:14px;cursor:pointer;}
.ms-opt input{width:18px;height:18px;accent-color:var(--deep);flex-shrink:0;}
.ms-opt .ms-name{flex:1;min-width:0;}
.ms-cnt{color:var(--text3);font-size:11px;flex-shrink:0;}
.ms-foot{display:flex;gap:8px;margin-top:8px;}
.ms-foot .btn{flex:1;margin-top:0;}
.ms-search{margin-bottom:6px;}
.mini-reset{border:1px solid rgba(26,10,46,0.2);background:var(--surface);color:var(--text2);font-size:11px;padding:3px 10px;border-radius:12px;cursor:pointer;font-family:inherit;}
.mini-reset:active{background:var(--gold-pale);}

/* v1.4.0 */
.is-temple{color:#1f7a8c;font-weight:500;}
.budget-ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:2px;padding:0 2px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="topbar-title">🏮 佛牌殿管理系統</div>
        <div class="topbar-sub" id="topbar-date">載入中...</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="topbar-btn" id="role-badge-btn" onclick="promptSwitchRole()" style="width:auto;padding:0 10px;font-size:11px;color:var(--gold-light);">身份</button>
        <button class="topbar-btn" onclick="showNotif()" style="color:#e8c97a;font-size:18px;">🔔</button>
      </div>
    </div>
  </div>
  
  <div class="tabbar" id="tabbar">
    <button class="tab active" data-page="home">首頁</button>
    <button class="tab" data-page="orders">訂單</button>
    <button class="tab" data-page="new-order">建立訂單</button>
    <button class="tab" data-page="filter">商品篩選</button>
    <button class="tab" data-page="products">商品庫</button>
    <button class="tab" data-page="customers">客戶</button>
    <button class="tab" data-page="report">報表</button>
    <button class="tab" data-page="settings">設定</button>
  </div>
  
  <div class="content" id="content">
    <!-- HOME -->
    <div class="page active" id="page-home"></div>
    <!-- ORDERS -->
    <div class="page" id="page-orders"></div>
    <!-- NEW ORDER -->
    <div class="page" id="page-new-order"></div>
    <!-- FILTER -->
    <div class="page" id="page-filter"></div>
    <!-- PRODUCTS -->
    <div class="page" id="page-products"></div>
    <!-- CUSTOMERS -->
    <div class="page" id="page-customers"></div>
    <!-- REPORT -->
    <div class="page" id="page-report"></div>
    <!-- SETTINGS -->
    <div class="page" id="page-settings"></div>
  </div>

  <!-- MODAL -->

async function syncConfigFromCloud(){
  if(!CLOUD_ENABLED) return;
  try{
    const { data, error } = await sb.from('settings').select('config').eq('tenant_id', TENANT_ID).maybeSingle();
    if(error) throw error;

    if(c && (c.cats || c.masters || c.effects)){
      if(c.cats) save('cats', c.cats);
      if(c.effects) save('effects', c.effects);
      if(c.masters) save('masters', c.masters);
      CONFIG = { catEffects:c.catEffects||{}, catPrefix:c.catPrefix||{} };
      save('config', CONFIG);
      _configSyncOk = true;
    } else {
      _configSyncOk = true;
      if(currentRole === 'admin') await pushConfigToCloud(); // 雲端還沒有設定 → 管理員把目前這台的清單上傳當初始值
    }
  }catch(e){ _configSyncOk = false; console.warn('分類設定雲端同步失敗，改用本機設定', e); }
}

function productToRow(p){ return { id:p.id, tenant_id:TENANT_ID, code:p.code, category:p.category, name:p.name, type:p.type, master:p.master, year:String(p.year), stock:p.stock, price:p.price, effects:p.effects, material:p.material, feature:p.feature, image:p.image, images:p.images||(p.image?[p.image]:[]), updated_by:'' }; }

async function syncProductsFromCloud(){
  if(!CLOUD_ENABLED) return false;
  try{
    const { data, error } = await sb.from('products').select('*').eq('tenant_id', TENANT_ID).order('updated_at',{ascending:false});
    if(error) throw error;
    save('products', data.map(rowToProduct));
    return true;
  }catch(e){ console.error('雲端商品同步失敗，改用本機資料', e); return false; }
}

// 商品新增/庫存更新時，寫回雲端（其他人下次開啟或下拉刷新就會看到）
async function pushProductToCloud(p){
  if(!CLOUD_ENABLED) return;
  try{ const { error } = await sb.from('products').upsert(productToRow(p)); if(error) throw error; }

window.migrateLocalToCloud=async function(){
  if(!CLOUD_ENABLED){ toast('⚠ 尚未設定雲端資料庫'); return; }
  toast('⬆️ 上傳中，請稍候...');
  try{
    const products=getProducts(), orders=getOrders(), customers=getCustomers();
    for(const p of products) await pushProductToCloud(p);
    for(const c of customers) await pushCustomerToCloud(c);

    toast(`✅ 已上傳 ${products.length} 商品、${orders.length} 訂單、${customers.length} 客戶`);
    await syncAllFromCloud();
    renderPage(currentPage||'home');
  }catch(e){ console.error(e); toast('⚠ 上傳過程發生錯誤，請檢查網路後再試一次'); }
}

function getOrders(){ return load('orders')||[]; }
function getCustomers(){ return load('customers')||[]; }
function getStaff(){ return load('staff')||[]; }

function getProductById(id){ return getProducts().find(p=>p.id===id)||null; }
function getProductName(id){ const p=getProductById(id); return p?p.name:id; }
function itemName(it){ return it.custom ? it.name : getProductName(it.productId); }
function itemPrice(it){ if(it.custom) return it.price||0; const p=getProductById(it.productId); return p?p.price:0; }
function itemLineTotal(it){ return itemPrice(it)*(it.qty||0); }
function itemCategory(it){ if(it.custom) return '其他'; const p=getProductById(it.productId); return p?p.category:''; }

function genOrderId(){
  const orders=getOrders();
  const n = orders.length ? parseInt(orders[0].id.replace('ORD',''))+1 : 2025001;
  return 'ORD'+String(n).padStart(7,'0');
}

// ============ UI HELPERS ============
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function openModal(html){ 
  document.getElementById('modal-content').innerHTML=html; 
  document.getElementById('modal').classList.add('open'); 
}
function closeModal(e){ 
  if(e && e.target!==document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open'); 
}
window._closeModal=function(){ document.getElementById('modal').classList.remove('open'); }

function chip(label, key, arr, onToggle){
  return `<span class="chip${arr.includes(label)?' on':''}" onclick="${onToggle}('${label.replace(/'/g,"\\'")}',this)">${label}</span>`;
}

function selectModal(title, options, onSelect, allowNew=false){
  const opts = options.map(o=>`<div class="order-card" style="padding:12px 14px;margin-bottom:6px;" onclick="_selectModalItem('${o.replace(/'/g,"\\'")}','${onSelect}')">${o}</div>`).join('');
  const newBtn = allowNew ? `<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="_addNewOption('${onSelect}')">+ 新增選項</button>` : '';
  openModal(`<div class="modal-title">${title}</div>${opts}${newBtn}`);
}
window._selectModalItem=function(val, fn){ window._closeModal(); if(window[fn]) window[fn](val); }
window._addNewOption=function(fn){ const v=prompt('輸入新選項：'); if(v&&v.trim()) { if(window[fn]) window[fn](v.trim()); } }

// ============ 身份與權限 ============
function canAccess(page){
  if(page==='home') return true;
  if(currentRole==='admin') return true;
  if(currentRole==='staff') return PERMISSIONS.staff?.[page] !== false && page!=='settings';
  return false; // 尚未登入
}

function applyRolePermissions(){
  document.querySelectorAll('.tab').forEach(t=>{
    const page = t.dataset.page;
    const allowed = page==='settings' ? currentRole==='admin' : canAccess(page);
    t.style.display = allowed ? '' : 'none';
  });
  const badge = document.getElementById('role-badge-btn');
  if(badge) badge.textContent = currentRole==='admin' ? `👑 ${currentProfile?.name||'管理員'}` : (currentRole==='staff' ? `🧑‍💼 ${currentProfile?.name||'客服/門市'}` : '身份');
}

function showRolePicker(){
  const el = document.getElementById('role-picker');

function hideRolePicker(){
  const el = document.getElementById('role-picker');

}

// 簡單編碼一下密碼再存，不是真正的加密，只是避免直接明碼躺在 localStorage 裡被一眼看到
function _pwEncode(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return ''; } }
function _pwDecode(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return ''; } }
function renderLoginForm(errorMsg, prefillEmail){
  // 「記住帳號」「記住密碼」勾選狀態：預設記帳號、不記密碼；登入失敗重新顯示時，保留使用者剛剛打的 email，密碼欄不帶回去
  const rememberEmailPref = localStorage.getItem('bpd_remember_email');
  const rememberEmailChecked = rememberEmailPref===null ? true : rememberEmailPref==='1';
  const rememberPwChecked = localStorage.getItem('bpd_remember_pw')==='1';
  const savedEmail = prefillEmail!=null ? prefillEmail : (rememberEmailChecked ? (localStorage.getItem('bpd_last_email')||'') : '');
  const savedPw = (prefillEmail==null && rememberPwChecked) ? _pwDecode(localStorage.getItem('bpd_saved_pw')||'') : '';
  document.getElementById('role-picker-content').innerHTML = `
    <div class="modal-title" style="text-align:center;">佛牌殿管理系統登入</div>
    ${errorMsg?`<div style="background:rgba(192,57,43,0.1);color:#c0392b;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:10px;text-align:center;">${errorMsg}</div>`:''}
    <form id="login-form" autocomplete="on">
      <input class="form-input" type="email" id="login-email" name="username" placeholder="Email" style="margin-bottom:10px;" autocomplete="username" value="${(savedEmail||'').replace(/"/g,'&quot;')}">
      <input class="form-input" type="password" id="login-pw" name="password" placeholder="密碼" style="margin-bottom:10px;" autocomplete="current-password" value="${(savedPw||'').replace(/"/g,'&quot;')}">
      <div style="display:flex;gap:16px;margin-bottom:14px;font-size:12px;color:var(--text2);">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" id="login-remember-email" ${rememberEmailChecked?'checked':''}> 記住帳號</label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" id="login-remember-pw" ${rememberPwChecked?'checked':''}> 記住密碼</label>
      </div>
      <button type="submit" class="btn btn-gold" id="login-btn">登入</button>
    </form>
    <div style="text-align:center;margin-top:12px;"><a href="#" style="font-size:12px;color:var(--text3);text-decoration:underline;" onclick="event.preventDefault();showForgotPassword();">忘記密碼？</a></div>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:14px;">帳號由管理員建立，如尚未有帳號請聯繫店長<br>「記住密碼」只存在這支裝置本機，共用電腦請不要勾選<br><span style="opacity:.7;">${APP_VERSION}</span></div>
  `;
  // 用真正的 <form> 送出，瀏覽器才認得出這是登入表單，才會跳出「記住密碼」的提示
  document.getElementById('login-form')?.addEventListener('submit', e=>{ e.preventDefault(); doLogin(); });
  // 帳號、密碼都已經記住的話直接聚焦登入鈕；只記了帳號則跳去密碼欄
  if(savedEmail && savedPw) document.getElementById('login-btn')?.focus();
  else if(savedEmail) document.getElementById('login-pw')?.focus();
}
window.doLogin=async function(){
  const email = document.getElementById('login-email')?.value?.trim();
  const password = document.getElementById('login-pw')?.value;
  const rememberEmail = document.getElementById('login-remember-email')?.checked;
  const rememberPw = document.getElementById('login-remember-pw')?.checked;
  if(!email||!password){ renderLoginForm('請輸入 Email 和密碼', email); return; }
  const btn = document.getElementById('login-btn'); if(btn){ btn.disabled=true; btn.textContent='登入中...'; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ renderLoginForm('登入失敗：帳號或密碼錯誤', email); return; }
  try{
    localStorage.setItem('bpd_remember_email', rememberEmail?'1':'0');
    if(rememberEmail) localStorage.setItem('bpd_last_email', email); else localStorage.removeItem('bpd_last_email');
    localStorage.setItem('bpd_remember_pw', rememberPw?'1':'0');
    if(rememberPw) localStorage.setItem('bpd_saved_pw', _pwEncode(password)); else localStorage.removeItem('bpd_saved_pw');
  }catch(e){}
  const ok = await loadCurrentProfile(data.user);
  if(!ok) return; // loadCurrentProfile 內已處理錯誤訊息與登出
  hideRolePicker();
  applyRolePermissions();
  await syncAllFromCloud();
  await logActivity('登入', '');
  navigateTo('home');
}

window.doForgotPassword=async function(){
  const email = document.getElementById('fp-email')?.value?.trim();
  if(!email){ toast('⚠ 請輸入 Email'); return; }
  const btn = document.getElementById('fp-btn'); if(btn){ btn.disabled=true; btn.textContent='寄送中...'; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if(error){ toast('⚠ 寄送失敗：'+error.message); if(btn){ btn.disabled=false; btn.textContent='寄送重設信'; } return; }
  document.getElementById('role-picker-content').innerHTML = `
    <div class="modal-title" style="text-align:center;">信已寄出</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:18px;text-align:center;line-height:1.7;">已經寄送重設密碼信到<br><b>${email}</b><br>請到信箱點裡面的連結設定新密碼<br>（沒看到的話記得看一下垃圾郵件）</div>
    <button class="btn btn-secondary" style="width:100%;" onclick="renderLoginForm()">← 返回登入</button>
  `;
}

window.doSetNewPassword=async function(){
  const pw1 = document.getElementById('snp-pw')?.value;
  const pw2 = document.getElementById('snp-pw2')?.value;
  if(!pw1||pw1.length<6){ toast('⚠ 密碼至少需要6碼'); return; }
  if(pw1!==pw2){ toast('⚠ 兩次輸入的密碼不一樣'); return; }
  const btn = document.getElementById('snp-btn'); if(btn){ btn.disabled=true; btn.textContent='更新中...'; }
  const { error } = await sb.auth.updateUser({ password: pw1 });
  if(error){ toast('⚠ 更新失敗：'+error.message); if(btn){ btn.disabled=false; btn.textContent='確認更改密碼'; } return; }
  history.replaceState(null, '', window.location.pathname); // 清掉網址上的重設密碼連結，避免重新整理又跳回這頁
  try{ localStorage.removeItem('bpd_saved_pw'); localStorage.setItem('bpd_remember_pw','0'); }catch(e){} // 舊密碼已經失效，別再自動帶出來
  await sb.auth.signOut();
  toast('✅ 密碼已更新，請用新密碼重新登入');
  renderLoginForm();
}

// 登入成功後，抓這個帳號在 profiles 表裡的角色/租戶資料
async function loadCurrentProfile(user){
  currentUser = user;
  try{
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(error) throw error;
    if(!data){ await sb.auth.signOut(); renderLoginForm('這個帳號尚未設定權限，請聯繫管理員'); return false; }
    if(!data.active){ await sb.auth.signOut(); renderLoginForm('這個帳號已被停用，請聯繫管理員'); return false; }
    currentProfile = data;
    currentRole = data.role;
    return true;
  }catch(e){
    console.error(e);
    await sb.auth.signOut();
    renderLoginForm('讀取帳號資料失敗，請重新登入');
    return false;
  }
}

// 電腦版滑鼠沒有觸控滑動手勢，這裡把「滾輪」跟「按住拖曳」都轉成頁籤列的橫向捲動
(function enableTabbarDesktopScroll(){
  const bar = document.getElementById('tabbar');
  bar.addEventListener('wheel', e=>{
    if(e.deltaY===0) return;
    bar.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive:false });

  let isDown=false, startX=0, startScroll=0, moved=false;
  bar.addEventListener('mousedown', e=>{ isDown=true; moved=false; startX=e.pageX; startScroll=bar.scrollLeft; });
  window.addEventListener('mouseup', ()=>{ isDown=false; });
  bar.addEventListener('mouseleave', ()=>{ isDown=false; });
  bar.addEventListener('mousemove', e=>{
    if(!isDown) return;
    const dx = e.pageX-startX;
    if(Math.abs(dx)>3) moved=true;
    bar.scrollLeft = startScroll - dx;
  });
  // 拖曳超過幾個像素時，放開滑鼠不要誤觸發下面的 tab 點擊
  bar.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

// 彈窗支援「由上緣往下拉」關閉（手機常見手勢，只有把手附近有效）
(function enableModalSwipeToClose(){
  const sheet = document.getElementById('modal-sheet');
  let startY=0, curY=0, dragging=false;
  sheet.addEventListener('touchstart', e=>{
    // 只有從彈窗上半部（含把手區）開始拖曳才視為關閉手勢，避免跟內容捲動衝突
    // 必須是從彈窗「最上緣」(把手附近 72px 內) 開始往下拉才會關閉；內容區滑動、清單捲動都不會誤關
    const touchY = e.touches[0].clientY;
    if(sheet.scrollTop>2 || (touchY - sheet.getBoundingClientRect().top) > 72) return;
    startY = touchY; curY=startY; dragging=true;
    sheet.style.transition='none';
  }, { passive:true });
  sheet.addEventListener('touchmove', e=>{
    if(!dragging) return;
    curY = e.touches[0].clientY;
    const dy = curY-startY;
    if(dy>0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  sheet.addEventListener('touchend', ()=>{
    if(!dragging) return;
    dragging=false;
    sheet.style.transition='';
    const dy = curY-startY;
    if(dy>80){ sheet.style.transform=''; _closeModal(); }
    else { sheet.style.transform=''; }
  });
})();

function navigateTo(page){
  if(!canAccess(page)){ toast('⚠ 你的身份沒有這個頁面的權限'); return; }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+page));
  currentPage = page;
  document.getElementById('content').scrollTop = 0;
  renderPage(page);
}

function renderPage(page){
  if(!canAccess(page)) page='home';
  const el = document.getElementById('page-'+page);
  if(!el) return;
  const renderers = { home: renderHome, orders: renderOrders, 'new-order': renderNewOrder, filter: renderFilter, products: renderProducts, customers: renderCustomers, report: renderReport, settings: renderSettings };
  if(renderers[page]) el.innerHTML = renderers[page]();
  bindPageEvents(page);
}

// ============ HOME ============
function renderHome(){
  const orders = getOrders();
  const todayShip = orders.filter(o=>o.status==='待寄出'||o.status==='待選鍊子');
  const curMonth = new Date().toISOString().slice(0,7); // yyyy-mm
  const thisMonth = orders.filter(o=>o.date&&o.date.startsWith(curMonth));
  const totalSales = thisMonth.reduce((sum,o)=> sum + (o.subtotal!=null ? o.subtotal : o.items.reduce((s,it)=>s+itemLineTotal(it),0)), 0);
  
  const rankMap = {};
  thisMonth.forEach(o=>o.items.forEach(it=>{ rankMap[itemName(it)]=(rankMap[itemName(it)]||0)+itemLineTotal(it); }));
  const ranking = Object.entries(rankMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  
  const rankHTML = ranking.map((r,i)=>`
    <div class="rank-item">
      <div class="rank-num${i===0?' r1':''}">${i+1}</div>
      <div class="rank-name">${r[0]}</div>
      <div class="rank-sales">$${r[1].toLocaleString()}</div>
    </div>`).join('');
  
  const shipCards = todayShip.slice(0,3).map(o=>{
    const items = o.items.map(it=>`${itemName(it)} ×${it.qty}`).join('、');
    const noGift = !['已寄出','取消','退貨'].includes(o.status) && o.items.some(it=>!['手鍊','符管'].includes(itemCategory(it))) && !o.gift;
    return `<div class="order-card" onclick="openOrderDetail('${o.id}')">
      <div class="order-head">
        <div><div class="order-name">${o.customer}</div><div class="order-id">#${o.id}</div></div>
        <span class="badge ${STATUS_BADGE[o.status]||'b-ship'}">${o.status}</span>
      </div>
      <div class="order-info">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail} · ${o.phone}</div>
      <div class="order-items-text">${items}</div>
      ${noGift?'<div class="alert-pill">⚠ 未填佛牌鍊，請確認</div>':''}
    </div>`;
  }).join('');

  return `
    <div style="display:flex;align-items:center;gap:8px;background:${CLOUD_ENABLED?'rgba(45,122,74,0.08)':'rgba(192,57,43,0.08)'};border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:${CLOUD_ENABLED?'#2d7a4a':'#c0392b'};">
      <span style="flex:1;">${CLOUD_ENABLED?'☁️ 雲端同步已啟用，商品/訂單/客戶全部多人同步':'⚠️ 尚未連接雲端資料庫，資料只存在這支裝置'}</span>
      ${CLOUD_ENABLED?'<button class="topbar-btn" style="width:auto;padding:4px 10px;background:rgba(45,122,74,0.15);color:#2d7a4a;font-size:11px;" onclick="migrateLocalToCloud()">上傳本機資料</button>':''}
    </div>
    <div class="stat-grid">
      <div class="stat-card accent" style="cursor:pointer;" onclick="goToOrdersFiltered('全部', curMonth)">
        <div class="stat-label">本月銷售額</div>
        <div class="stat-val">$${totalSales.toLocaleString()}</div>
        <div class="stat-tag tag-up">↑ 持續成長中</div>
      </div>
      <div class="stat-card" style="cursor:pointer;" onclick="goToOrdersFiltered('待寄出', '')">
        <div class="stat-label">今日待出貨</div>
        <div class="stat-val" style="color:#c0392b;">${todayShip.length} 筆</div>
        <div class="stat-tag tag-warn">需處理</div>
      </div>
      <div class="stat-card" style="cursor:pointer;" onclick="goToOrdersFiltered('全部', curMonth)">
        <div class="stat-label">本月訂單數</div>
        <div class="stat-val">${thisMonth.length}</div>
        <div class="stat-tag tag-up">筆訂單</div>
      </div>
      <div class="stat-card" style="cursor:pointer;" onclick="goToOrdersFiltered('待選鍊子', '')">
        <div class="stat-label">待選鍊子</div>
        <div class="stat-val" style="color:#a06010;">${orders.filter(o=>o.status==='待選鍊子').length} 筆</div>
        <div class="stat-tag tag-warn">待確認</div>
      </div>
    </div>
    <div class="sec">今日待出貨</div>
    ${shipCards || '<div class="empty-state"><div class="emoji">✅</div><p>今日無待出貨訂單</p></div>'}
    <div class="sec" style="margin-top:20px;">本月銷售排行</div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;border:1px solid rgba(26,10,46,0.06);">
      ${rankHTML || '<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px;">暫無資料</div>'}
    </div>`;
}

let orderFilter = '全部';
let orderSearch = '';
let orderMonthFilter = new Date().toISOString().slice(0,7); // 預設只顯示當月訂單，空字串代表「全部月份」
function getFilteredOrders(){
  const orders = getOrders();
  let filtered = orders;
  if(orderMonthFilter) filtered = filtered.filter(o=>o.date && o.date.startsWith(orderMonthFilter));
  if(orderFilter!=='全部') filtered = filtered.filter(o=>o.status===orderFilter);
  if(orderSearch) filtered = filtered.filter(o=>o.customer.includes(orderSearch)||o.id.includes(orderSearch)||o.phone.includes(orderSearch)||(o.recipientName||'').includes(orderSearch));
  return filtered;
}
function orderCardsHTML(filtered){
  const quickStatusOpts = STATUS_LIST.filter(s=>s!=='全部');
  const cards = filtered.map(o=>{
    const items = o.items.map(it=>`${itemName(it)} ×${it.qty}`).join('、');
    const noGift = !['已寄出','取消','退貨'].includes(o.status) && o.items.some(it=>!['手鍊','符管','周邊聖物'].includes(itemCategory(it))) && !o.gift;
    return `<div class="order-card">
      <div class="order-head" onclick="openOrderDetail('${o.id}')" style="cursor:pointer;">
        <div><div class="order-name">${o.customer}${o.recipientName&&o.recipientName!==o.customer?' → 收：'+o.recipientName:''}</div><div class="order-id">#${o.id} · ${o.date}</div></div>
        <span class="badge ${STATUS_BADGE[o.status]||'b-ship'}">${o.status}</span>
      </div>
      <div class="order-info" onclick="openOrderDetail('${o.id}')" style="cursor:pointer;">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail}<br>接單：${o.staff} · 來源：${o.source}</div>
      <div class="order-items-text" onclick="openOrderDetail('${o.id}')" style="cursor:pointer;">${items}${o.gift?' ｜ 贈品：'+o.gift:''}${o.total?' ｜ 總額：$'+o.total.toLocaleString():''}</div>
      ${noGift?'<div class="alert-pill">⚠ 未填佛牌鍊，請確認</div>':''}
      ${o.note?`<div style="font-size:12px;color:var(--text3);margin-top:6px;">備註：${o.note}</div>`:''}
      <div style="margin-top:8px;" onclick="event.stopPropagation()">
        <select class="form-select" style="font-size:12px;padding:8px 10px;" onchange="quickUpdateStatus('${o.id}', this.value)">
          ${quickStatusOpts.map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>`;
  }).join('');
  return cards || '<div class="empty-state"><div class="emoji">📋</div><p>無符合訂單</p></div>';
}
function renderOrders(){
  const orders = getOrders();
  const filtered = getFilteredOrders();
  const statusBtns = STATUS_LIST.map(s=>`<span class="chip${orderFilter===s?' on':''}" onclick="setOrderFilter('${s}')" style="white-space:nowrap;">${s}</span>`).join('');
  const monthOpts = `<option value=""${orderMonthFilter===''?' selected':''}>全部月份</option>` + getAvailableMonths(orders).map(m=>`<option value="${m}"${orderMonthFilter===m?' selected':''}>${monthLabel(m)}</option>`).join('');

  return `
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="search-bar" style="flex:1;"><span class="search-icon">🔍</span><input type="text" placeholder="搜尋訂單、客戶、電話..." id="order-search" value="${orderSearch}" oninput="setOrderSearch(this.value)" style="padding-right:34px;"><span class="search-clear" id="order-search-clear" style="display:${orderSearch?'flex':'none'};" onclick="document.getElementById('order-search').value='';setOrderSearch('');">✕</span></div>
      <button class="topbar-btn" style="background:rgba(26,10,46,0.08);flex-shrink:0;" onclick="refreshOrdersFromCloud()" title="同步雲端最新資料">🔄</button>
      <button class="topbar-btn" style="background:rgba(26,10,46,0.08);flex-shrink:0;width:auto;padding:0 10px;font-size:12px;" onclick="exportOrdersExcel()" title="匯出Excel">📊 匯出</button>
    </div>
    <select class="form-select" style="margin-bottom:10px;" onchange="setOrderMonthFilter(this.value)">${monthOpts}</select>
    <div class="chip-row" style="margin-bottom:14px;">${statusBtns}</div>
    <div id="orders-list">${orderCardsHTML(filtered)}</div>
    <div style="height:80px;"></div>`;
}
window.setOrderMonthFilter=function(v){ orderMonthFilter=v; renderPage('orders'); }
window.setOrderFilter=function(s){ orderFilter=s; renderPage('orders'); }
window.setOrderSearch=function(v){
  orderSearch=v;
  const el=document.getElementById('orders-list');
  if(el) el.innerHTML = orderCardsHTML(getFilteredOrders());
  const clearBtn=document.getElementById('order-search-clear'); if(clearBtn) clearBtn.style.display = v?'flex':'none';
}

window.openOrderDetail=function(id){
  const o = getOrders().find(x=>x.id===id);
  if(!o) return;
  const items = o.items.map(it=>`${itemName(it)} ×${it.qty} ($${itemPrice(it).toLocaleString()})`).join('<br>');
  const statusOpts = ['待寄出','待選鍊子','待自取','已寄出','取消','退貨'].map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('');
  openModal(`
    <div class="modal-title">訂單詳情 #${o.id}</div>
    <div class="detail-row"><span class="detail-key">訂購人（暱稱）</span><span class="detail-val">${o.customer}</span></div>
    <div class="detail-row"><span class="detail-key">收件人</span><span class="detail-val">${o.recipientName||o.customer}</span></div>
    <div class="detail-row"><span class="detail-key">收件人電話</span><span class="detail-val">${o.phone}</span></div>
    <div class="detail-row"><span class="detail-key">寄送方式</span><span class="detail-val">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail}</span></div>
    <div class="detail-row"><span class="detail-key">訂購商品</span><span class="detail-val">${items}</span></div>
    <div class="detail-row"><span class="detail-key">贈品</span><span class="detail-val">${o.gift||'—'}</span></div>
    ${o.total?`
    <div class="detail-row"><span class="detail-key">商品小計</span><span class="detail-val">$${(o.subtotal||0).toLocaleString()}</span></div>
    <div class="detail-row"><span class="detail-key">運費</span><span class="detail-val">$${(o.shippingFee||0).toLocaleString()}</span></div>
    <div class="detail-row"><span class="detail-key">應付總額</span><span class="detail-val" style="font-weight:600;">$${o.total.toLocaleString()}</span></div>`:''}
    <div class="detail-row"><span class="detail-key">接單人員</span><span class="detail-val">${o.staff}</span></div>
    <div class="detail-row"><span class="detail-key">客戶來源</span><span class="detail-val">${o.source}</span></div>
    <div class="detail-row"><span class="detail-key">備註</span><span class="detail-val">${o.note||'—'}</span></div>
    <div style="margin-top:16px;">
      <div class="form-label">更新進度</div>
      <select class="form-select" id="status-sel">${statusOpts}</select>
    </div>
    <button class="btn btn-primary" onclick="updateOrderStatus('${id}')">更新訂單狀態</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="openEditOrder('${id}')">✏️ 編輯訂單內容</button>
    <button class="btn" style="width:100%;margin-top:8px;background:#fdece8;color:#c0392b;" onclick="confirmDeleteOrder('${id}')">🗑 刪除訂單</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="_closeModal()">關閉</button>
  `);
}

window.exportOrdersExcel=function(){
  const filtered = getFilteredOrders();
  if(!filtered.length){ toast('⚠ 沒有可匯出的訂單'); return; }

  const rows = filtered.map(o=>({
    '訂單編號': o.id,
    '下單日期': o.date,
    '訂購人(暱稱)': o.customer,
    '收件人': o.recipientName||o.customer,
    '收件人電話': o.phone,
    '寄送方式': o.shipping==='門市自取'?'門市自取':`${o.shipping} ${o.shippingDetail||''}`,
    '商品明細': o.items.map(it=>`${itemName(it)}×${it.qty}`).join('、'),
    '贈品': o.gift||'',
    '商品小計': o.subtotal||0,
    '運費': o.shippingFee||0,
    '應付總額': o.total||(o.subtotal||0)+(o.shippingFee||0),
    '狀態': o.status,
    '客戶來源': o.source,
    '接單人員': o.staff,
    '備註': o.note||''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k=>({ wch: Math.max(10, k.length*2) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '訂單明細');
  const label = orderFilter!=='全部' ? orderFilter : '全部';
  XLSX.writeFile(wb, `佛牌殿訂單_${label}_${new Date().toISOString().slice(0,10)}.xlsx`);
  logActivity('匯出訂單Excel', `${filtered.length} 筆（${label}）`);
}

window.confirmDeleteOrder=function(id){
  openModal(`
    <div class="modal-title">刪除訂單</div>
    <div style="font-size:14px;margin-bottom:6px;">確定要刪除訂單 #${id} 嗎？</div>
    <div style="font-size:12px;color:#c0392b;margin-bottom:18px;">⚠ 這個動作無法復原。訂單裡的商品庫存會自動歸還。</div>
    <button class="btn" style="width:100%;background:#c0392b;color:#fff;" onclick="deleteOrder('${id}')">確定刪除</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="_closeModal()">取消</button>
  `);
}
window.deleteOrder=async function(id){
  const orders=getOrders();
  const order=orders.find(o=>o.id===id);
  const remaining=orders.filter(o=>o.id!==id);
  save('orders', remaining);

  if(order){
    // 歸還庫存
    const products=getProducts();
    const touched=[];
    order.items.filter(it=>!it.custom).forEach(it=>{
      const idx=products.findIndex(p=>p.id===it.productId);
      if(idx>=0){ products[idx].stock += it.qty; touched.push(products[idx]); }
    });
    save('products', products);
    for(const p of touched) await pushProductToCloud(p);
  }

  if(CLOUD_ENABLED){
    try{ const { error } = await sb.from('orders').delete().eq('id', id); if(error) throw error; }
    catch(e){ console.error('雲端刪除訂單失敗', e); toast('⚠ 雲端刪除失敗，請檢查網路'); }
  }
  await logActivity('刪除訂單', `#${id}`);
  _closeModal();
  toast('✅ 訂單已刪除，庫存已歸還');
  renderPage('orders');
  renderPage('home');
}

window.quickUpdateStatus=async function(id, newStatus){
  const orders = getOrders();
  const i = orders.findIndex(o=>o.id===id);
  if(i>=0){ orders[i].status=newStatus; save('orders',orders); await pushOrderToCloud(orders[i]); await logActivity('更新訂單狀態', `#${id} → ${newStatus}`); }
  toast('✅ 訂單狀態已更新'+(CLOUD_ENABLED?'（已同步雲端）':''));
  renderPage('orders');
  renderPage('home');
}

// ---- 編輯既有訂單 ----
let _editOrderItems = [];
let _editForceFree = false;
let _editOrderDraft = null; // 保存使用者目前在文字欄位打的內容，避免重繪時被原始訂單資料蓋掉
window.openEditOrder=function(id){
  const o = getOrders().find(x=>x.id===id);
  if(!o) return;
  _editOrderItems = o.items.map(it=> it.custom ? {...it, id:'custom_'+Math.random()} : { id:it.productId, name:itemName(it), price:itemPrice(it), qty:it.qty, custom:false, category:itemCategory(it) });
  _editForceFree = (o.shippingFee||0)===0 && o.shipping && o.shipping!=='門市自取';
  _editOrderDraft = { customer:o.customer, recipientName:o.recipientName||'', phone:o.phone, shipping:o.shipping, shippingDetail:o.shippingDetail||'', gift:o.gift||'', staff:o.staff, note:o.note||'' };
  _closeModal();
  renderEditOrderModal(id);
}
function captureEditOrderDraft(){
  if(!_editOrderDraft) return;
  const val=(id,fallback)=>{ const el=document.getElementById(id); return el ? el.value : fallback; };
  _editOrderDraft = {
    customer: val('eo-customer', _editOrderDraft.customer),
    recipientName: val('eo-recipient', _editOrderDraft.recipientName),
    phone: val('eo-phone', _editOrderDraft.phone),
    shipping: val('eo-shipping', _editOrderDraft.shipping),
    shippingDetail: val('eo-ship-detail', _editOrderDraft.shippingDetail),
    gift: val('eo-gift', _editOrderDraft.gift),
    staff: val('eo-staff', _editOrderDraft.staff),
    note: val('eo-note', _editOrderDraft.note),
  };
}
window.onEditOrderShipChange=function(id){
  captureEditOrderDraft();
  renderEditOrderModal(id);
}
function editOrderSummary(shipping){
  const subtotal = _editOrderItems.reduce((s,p)=>s+p.price*p.qty,0);
  let shippingFee=0;
  if(!_editForceFree && shipping!=='門市自取' && subtotal<5000){
    if(shipping==='711') shippingFee=60;
    else if(shipping==='黑貓') shippingFee=130;
  }
  return { subtotal, shippingFee, total:subtotal+shippingFee };
}
function renderEditOrderModal(id){
  const o = getOrders().find(x=>x.id===id); if(!o) return;
  const d = _editOrderDraft || { customer:o.customer, recipientName:o.recipientName||'', phone:o.phone, shipping:o.shipping, shippingDetail:o.shippingDetail||'', gift:o.gift||'', staff:o.staff, note:o.note||'' };
  const staff = getStaff();
  const shipping = d.shipping;
  const { subtotal, shippingFee, total } = editOrderSummary(shipping);
  const itemsList = _editOrderItems.map((sp,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface);border-radius:8px;margin-bottom:6px;">
      <div style="flex:1;">
        <div style="font-size:13px;">${sp.name}${sp.custom?' <span style="color:var(--text3);font-size:11px;">（手動輸入）</span>':''}</div>
        <div style="font-size:12px;color:var(--text3);">$${sp.price.toLocaleString()} × ${sp.qty} = $${(sp.price*sp.qty).toLocaleString()}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button onclick="editOrderChangeQty(${i},-1,'${id}')" style="width:26px;height:26px;border-radius:50%;border:1px solid rgba(26,10,46,0.2);background:var(--white);">−</button>
        <span style="font-size:13px;min-width:18px;text-align:center;">${sp.qty}</span>
        <button onclick="editOrderChangeQty(${i},1,'${id}')" style="width:26px;height:26px;border-radius:50%;border:1px solid rgba(26,10,46,0.2);background:var(--white);">＋</button>
        <button onclick="editOrderRemoveItem(${i},'${id}')" style="width:26px;height:26px;border-radius:50%;border:none;background:#fce4e4;color:#c0392b;">✕</button>
      </div>
    </div>`).join('');

  openModal(`
    <div class="modal-title">編輯訂單 #${o.id}</div>
    <div class="form-block"><label class="form-label">訂購人姓名（暱稱）</label><input class="form-input" id="eo-customer" value="${d.customer}"></div>
    <div class="form-block"><label class="form-label">收件人姓名</label><input class="form-input" id="eo-recipient" value="${d.recipientName}"></div>
    <div class="form-block"><label class="form-label">收件人電話</label><input class="form-input" id="eo-phone" value="${d.phone}"></div>
    <div class="form-block">
      <label class="form-label">寄送方式</label>
      <select class="form-select" id="eo-shipping" onchange="onEditOrderShipChange('${id}')">${SHIP_LIST.map(s=>`<option${shipping===s?' selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="form-block" style="${shipping==='門市自取'?'display:none':''}">
      <label class="form-label">寄送地址／門市</label>
      <input class="form-input" id="eo-ship-detail" value="${d.shippingDetail}">
    </div>
    <div class="form-block">
      <label class="form-label">訂購商品</label>
      ${itemsList}
      <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:6px;" onclick="captureEditOrderDraft();openEditOrderProductPicker('${id}')">＋ 新增商品</button>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;border:1px solid rgba(26,10,46,0.06);margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>商品小計</span><span>$${subtotal.toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>運費</span><span>$${shippingFee.toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600;padding:8px 0 2px;border-top:1px dashed rgba(26,10,46,0.15);"><span>應付總額</span><span>$${total.toLocaleString()}</span></div>
      ${shipping!=='門市自取'?`<button class="btn ${_editForceFree?'btn-gold':'btn-secondary'} btn-sm" style="width:100%;margin-top:8px;" onclick="toggleEditForceFree('${id}')">${_editForceFree?'✓ 已強制免運':'強制免運'}</button>`:''}
    </div>
    <div class="form-block"><label class="form-label">贈品</label><input class="form-input" id="eo-gift" value="${d.gift}"></div>
    <div class="form-block"><label class="form-label">接單人員</label><select class="form-select" id="eo-staff">${staff.map(s=>`<option${d.staff===s?' selected':''}>${s}</option>`).join('')}</select></div>
    <div class="form-block"><label class="form-label">備註</label><textarea class="form-textarea" id="eo-note" rows="2">${d.note}</textarea></div>
    <button class="btn btn-gold" onclick="saveEditOrder('${id}')">儲存變更</button>
    <div style="height:20px;"></div>
  `);
}
window.editOrderChangeQty=function(i,delta,id){ captureEditOrderDraft(); _editOrderItems[i].qty+=delta; if(_editOrderItems[i].qty<=0) _editOrderItems.splice(i,1); renderEditOrderModal(id); }
window.editOrderRemoveItem=function(i,id){ captureEditOrderDraft(); _editOrderItems.splice(i,1); renderEditOrderModal(id); }
window.toggleEditForceFree=function(id){ captureEditOrderDraft(); _editForceFree=!_editForceFree; renderEditOrderModal(id); }
window.openEditOrderProductPicker=function(id){
  const products=getProducts();
  openModal(`
    <div class="modal-title">選擇商品</div>
    <button class="btn btn-secondary btn-sm" style="width:100%;margin-bottom:10px;" onclick="openEditOrderCustomItem('${id}')">✏️ 其他（手動輸入）</button>
    <div style="max-height:55vh;overflow-y:auto;">${products.map(p=>`
      <div class="product-card" onclick="editOrderAddProduct('${p.id}','${id}')">
        <div class="product-img" style="width:44px;height:44px;font-size:18px;overflow:hidden;">${imgTag(p.image,160)||'🏺'}</div>
        <div><div class="product-name">${p.name}</div><div class="product-meta">${p.code}</div><div style="font-size:13px;font-weight:500;">$${p.price.toLocaleString()}</div></div>
      </div>`).join('')}</div>
  `);
}
window.editOrderAddProduct=function(pid,id){
  const p=getProductById(pid); if(!p) return;
  const exist=_editOrderItems.findIndex(x=>x.id===pid);
  if(exist>=0) _editOrderItems[exist].qty++;
  else _editOrderItems.push({...p,qty:1,custom:false});
  renderEditOrderModal(id);
}
window.openEditOrderCustomItem=function(id){
  openModal(`
    <div class="modal-title">手動輸入商品</div>
    <div class="form-block"><label class="form-label">品名 *</label><input class="form-input" id="eci-name"></div>
    <div class="form-block"><label class="form-label">單價 *</label><input class="form-input" type="number" id="eci-price"></div>
    <div class="form-block"><label class="form-label">數量</label><input class="form-input" type="number" id="eci-qty" value="1"></div>
    <button class="btn btn-gold" onclick="editOrderAddCustom('${id}')">加入訂單</button>
  `);
}
window.editOrderAddCustom=function(id){
  const name=document.getElementById('eci-name')?.value?.trim();
  const price=parseInt(document.getElementById('eci-price')?.value);
  const qty=parseInt(document.getElementById('eci-qty')?.value)||1;
  if(!name||!price){ toast('⚠ 請填寫品名與單價'); return; }
  _editOrderItems.push({ id:'custom_'+Date.now(), name, price, qty, custom:true, category:'其他' });
  renderEditOrderModal(id);
}
window.saveEditOrder=async function(id){
  const orders = getOrders();
  const i = orders.findIndex(o=>o.id===id);
  if(i<0) return;
  const oldOrder = orders[i];
  const customer=document.getElementById('eo-customer')?.value?.trim();
  const recipientName=document.getElementById('eo-recipient')?.value?.trim();
  const phone=document.getElementById('eo-phone')?.value?.trim();
  const shipping=document.getElementById('eo-shipping')?.value;
  if(!customer||!phone){ toast('⚠ 請填寫訂購人與收件人電話'); return; }
  if(!_editOrderItems.length){ toast('⚠ 至少需要一項商品'); return; }
  const { subtotal, shippingFee, total } = editOrderSummary(shipping);

  const newItems = _editOrderItems.map(sp=>sp.custom?{custom:true,name:sp.name,price:sp.price,qty:sp.qty}:{productId:sp.id,qty:sp.qty});

  // 調整庫存差異：舊訂單商品先「還原」，新訂單商品再「扣除」
  const products = getProducts();
  const applyDelta=(productId, delta)=>{ const idx=products.findIndex(p=>p.id===productId); if(idx>=0) products[idx].stock=Math.max(0, products[idx].stock-delta); };
  oldOrder.items.filter(it=>!it.custom).forEach(it=> applyDelta(it.productId, -it.qty)); // 還原
  newItems.filter(it=>!it.custom).forEach(it=> applyDelta(it.productId, it.qty)); // 重新扣除
  save('products', products);
  const touchedIds = new Set([...oldOrder.items.filter(it=>!it.custom).map(it=>it.productId), ...newItems.filter(it=>!it.custom).map(it=>it.productId)]);
  for(const pid of touchedIds){ const p=getProductById(pid); if(p) await pushProductToCloud(p); }

  const updated = { ...oldOrder, customer, recipientName:recipientName||customer, phone, shipping,
    shippingDetail:document.getElementById('eo-ship-detail')?.value||'',
    items:newItems, gift:document.getElementById('eo-gift')?.value||'',
    staff:document.getElementById('eo-staff')?.value||oldOrder.staff,
    note:document.getElementById('eo-note')?.value||'',
    subtotal, shippingFee, total };
  orders[i]=updated;
  save('orders',orders);
  await pushOrderToCloud(updated);
  await logActivity('編輯訂單', `#${id}`);

  _closeModal();
  toast('✅ 訂單已更新'+(CLOUD_ENABLED?'（已同步雲端）':''));
  renderPage('orders');
}

window.updateOrderStatus=async function(id){

  const orders = getOrders();
  const i = orders.findIndex(o=>o.id===id);
  if(i>=0){ orders[i].status=sel.value; save('orders',orders); await pushOrderToCloud(orders[i]); await logActivity('更新訂單狀態', `#${id} → ${sel.value}`); }
  _closeModal();
  toast('✅ 訂單狀態已更新'+(CLOUD_ENABLED?'（已同步雲端）':''));
  renderPage('orders');
  renderPage('home');
}

let newOrder = { customer:'', recipientName:'', phone:'', shipping:'', shippingDetail:'', items:[], gift:'', staff:'', source:'', note:'' };

function computeOrderSummary(){
  const subtotal = selectedProducts.reduce((s,p)=>s+p.price*p.qty, 0);
  const shipping = document.getElementById('no-shipping')?.value || newOrder.shipping;
  let shippingFee = 0;
  if(!forceFreeShipping && shipping!=='門市自取' && subtotal<5000){
    if(shipping==='711') shippingFee=60;
    else if(shipping==='黑貓') shippingFee=130;
  }
  return { subtotal, shippingFee, total: subtotal+shippingFee, shipping };
}

window.fillCustomer=function(id, idx){
  const c=getCustomers().find(x=>x.id===id); if(!c)return;
  const ms=customerMethods(c);

  onShipChange(m.type||'');

  if(!customer){ toast('⚠ 請填入訂購人姓名（暱稱）'); return; }
  if(!phone){ toast('⚠ 請填入收件人電話'); return; }

  if(!selectedProducts.length && shipping && shipping!=='門市自取'){
    openModal(`
      <div class="modal-title">確認運費</div>
      <div style="font-size:13px;margin-bottom:16px;line-height:1.6;">這筆訂單沒有加入任何商品（例如抽獎中獎寄送），是否需要向客戶收取運費？</div>

      <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="_closeModal();finalizeSubmitOrder(true)">本次贈送，不收運費</button>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px;background:none;" onclick="_closeModal()">取消</button>
    `);

window.finalizeSubmitOrder=async function(forceFreeOverride){
  if(forceFreeOverride!==undefined) forceFreeShipping = forceFreeOverride;
  const customer=document.getElementById('no-customer')?.value?.trim();
  const recipientName=document.getElementById('no-recipient')?.value?.trim();
  const phone=document.getElementById('no-phone')?.value?.trim();
  const shipping=document.getElementById('no-shipping')?.value;
  
  const orders=getOrders();
  const newId=genOrderId();
  const hasBuddha=selectedProducts.some(p=>!p.custom && !['手鍊','符管','周邊聖物','充電寶'].includes(p.category));
  const gift=document.getElementById('no-gift')?.value||'';
  const { subtotal, shippingFee, total } = computeOrderSummary();
  
  const newOrderRecord = {
    id:newId,
    date:new Date().toISOString().slice(0,10),
    customer, recipientName: recipientName||customer, phone,shipping,
    shippingDetail:document.getElementById('no-ship-detail')?.value||'',
    items:selectedProducts.map(p=>p.custom?{custom:true,name:p.name,price:p.price,qty:p.qty}:{productId:p.id,qty:p.qty}),
    gift,
    staff:document.getElementById('no-staff')?.value||getStaff()[0],
    source:newOrder.source||'門市',
    status:'待寄出',
    note:document.getElementById('no-note')?.value||'',
    subtotal, shippingFee, total
  };
  orders.unshift(newOrderRecord);
  save('orders',orders);
  await pushOrderToCloud(newOrderRecord);
  
  // Update stock（手動輸入的品項沒有對應商品，不用扣庫存）
  const products=getProducts();
  const changedProducts=[];
  selectedProducts.filter(sp=>!sp.custom).forEach(sp=>{ const i=products.findIndex(p=>p.id===sp.id); if(i>=0){ products[i].stock=Math.max(0,products[i].stock-sp.qty); changedProducts.push(products[i]); } });
  save('products',products);
  for(const p of changedProducts) await pushProductToCloud(p);
  
  // Save/update customer：同一個人如果換了新的收件方式（地址/門市），視為新增一筆客戶收件資料，
  // 這樣之後在「訂購人姓名」搜尋時，同一人的不同收件地址都能個別被選到、複製，不會互相覆蓋掉。
  const customers=getCustomers();
  const shipDetail=(document.getElementById('no-ship-detail')?.value||'').trim();
  const todayStr=new Date().toISOString().slice(0,10);
  const recip=(recipientName||'').trim();
  let savedCustomer = customers.find(c=>_nk(c.name)===_nk(customer)) || (phone && customers.find(c=>c.phone===phone));
  if(!savedCustomer){
    savedCustomer={id:'C'+Date.now(),name:customer,realName:(recip&&recip!==customer)?recip:'',lineName:'',email:'',phone,shipping:'',shippingDetail:'',methods:[]};
    customers.push(savedCustomer);
  } else {
    if(!savedCustomer.phone && phone) savedCustomer.phone=phone;
    if(!savedCustomer.realName && recip && recip!==customer) savedCustomer.realName=recip;
  }
  // 同一個人換了新的收件方式 → 加進他的「收件方式」清單；用過的方式累計次數
  let ms=customerMethods(savedCustomer).map(m=>({...m}));
  if(shipping){
    const ex=ms.find(x=>(x.type||'')===shipping && (x.detail||'')===shipDetail);
    if(ex){ ex.count=(ex.count||0)+1; ex.last=todayStr; }
    else ms.push({type:shipping,detail:shipDetail,recipient:(recip&&recip!==customer&&recip!==savedCustomer.realName)?recip:'',phone:(phone&&phone!==savedCustomer.phone)?phone:'',count:1,last:todayStr});
  }
  if(ms.length){
    // 有手動設為常用的就維持；否則「用最多次、同次數取最近」自動成為常用
    const best = ms.find(m=>m.pinned) || [...ms].sort((a,b)=>(b.count||0)-(a.count||0)||String(b.last||'').localeCompare(String(a.last||'')))[0];
    ms=[best, ...ms.filter(m=>m!==best)];
    savedCustomer.shipping=best.type; savedCustomer.shippingDetail=best.detail||'';
  }
  savedCustomer.methods=ms;
  save('customers',customers);
  await pushCustomerToCloud(savedCustomer);
  await logActivity('建立訂單', `#${newId} ${customer}（$${total.toLocaleString()}）`);
  
  selectedProducts=[];
  forceFreeShipping=false;
  newOrder={ customer:'',recipientName:'',phone:'',shipping:'',shippingDetail:'',items:[],gift:'',staff:'',source:'',note:'' };
  
  if(hasBuddha&&!gift) toast('⚠ 訂單建立！注意：未填佛牌鍊');
  else toast('✅ 訂單 #'+newId+' 建立成功！');
  navigateTo('orders');
}

let filterState = { q:'', cats:[], effects:[], masters:[], types:[], budgetMin:'', budgetMax:'', showOutOfStock:false };
function computeFilterResults(){
  const hasFilter = filterState.q||filterState.cats.length||filterState.effects.length||filterState.masters.length||filterState.types.length||filterState.budgetMin||filterState.budgetMax;
  if(!hasFilter) return { hasFilter:false, results:[] };
  const results = getProducts().filter(p=>{
    if(!filterState.showOutOfStock && p.stock<=0) return false;
    if(filterState.q && !(p.name.includes(filterState.q)||p.code.includes(filterState.q)||p.category.includes(filterState.q)||(p.master||'').includes(filterState.q))) return false;
    if(filterState.cats.length && !filterState.cats.includes(p.category)) return false;
    if(filterState.effects.length && !filterState.effects.some(e=>p.effects.includes(e))) return false;
    if(filterState.masters.length && !filterState.masters.includes(p.master)) return false;
    if(filterState.types.length && !filterState.types.includes(p.type)) return false;
    if(filterState.budgetMin && p.price<parseInt(filterState.budgetMin)) return false;
    if(filterState.budgetMax && p.price>parseInt(filterState.budgetMax)) return false;
    return true;
  });
  return { hasFilter:true, results };
}

const BUDGET_STEP = 5000, BUDGET_POS_MAX = 20, BUDGET_SLIDER_MAX = BUDGET_STEP * BUDGET_POS_MAX;
function posToPrice(pos){ return Math.max(0, Math.min(BUDGET_POS_MAX, parseInt(pos)||0)) * BUDGET_STEP; }
function priceToPos(price){ return Math.min(BUDGET_POS_MAX, Math.max(0, Math.round((parseInt(price)||0) / BUDGET_STEP))); }
function budgetLabel(){
  const min = filterState.budgetMin ? parseInt(filterState.budgetMin) : 0;
  if(!filterState.budgetMax) return min >= BUDGET_SLIDER_MAX ? `$${min.toLocaleString()} 以上` : `$${min.toLocaleString()} - $${BUDGET_SLIDER_MAX.toLocaleString()} 以上`;
  return `$${min.toLocaleString()} - $${parseInt(filterState.budgetMax).toLocaleString()}`;
}

  }
  const minPos = parseInt(minEl.value), maxPos = parseInt(maxEl.value);
  filterState.budgetMin = minPos > 0 ? String(posToPrice(minPos)) : '';
  filterState.budgetMax = maxPos < BUDGET_POS_MAX ? String(posToPrice(maxPos)) : '';

// ---- 種類/師傅/功效 清單管理（新增、改名、刪除；種類另可設定編號前綴與預設功效）----
const LIST_CONFIG = {
  cats: { key:'cats', label:'商品種類', fallback: CATS },
  effects: { key:'effects', label:'功效需求', fallback: EFFECTS },
  masters: { key:'masters', label:'製作師傅', fallback: MASTERS }
};
function getList(type){ const cfg = LIST_CONFIG[type]; return load(cfg.key) || cfg.fallback; }
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return escH(s).replace(/"/g,'&quot;'); }
function listUsageCount(type, v){
  const ps = getProducts();
  if(type==='cats') return ps.filter(p=>p.category===v).length;
  if(type==='masters') return ps.filter(p=>p.master===v).length;
  return ps.filter(p=>(p.effects||[]).includes(v)).length;
}
// 商品編號前綴：優先用設定頁指定的；沒指定就看這個種類現有商品最常用的英文字母；都沒有就挑一個沒被用過的字母
function catPrefixFor(cat){
  if(CONFIG.catPrefix && CONFIG.catPrefix[cat]) return CONFIG.catPrefix[cat].toUpperCase();
  const products = getProducts();
  const prefixOf = c => { const m = String(c||'').match(/^([A-Za-z]+)\d+$/); return m ? m[1].toUpperCase() : null; };
  const cnt = {};
  products.filter(p=>p.category===cat).forEach(p=>{ const k = prefixOf(p.code); if(k) cnt[k] = (cnt[k]||0)+1; });
  const best = Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0];
  if(best) return best[0];
  const used = new Set([...Object.values(CONFIG.catPrefix||{}).map(x=>x.toUpperCase()), ...products.map(p=>prefixOf(p.code)).filter(Boolean)]);
  for(const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){ if(!used.has(ch)) return ch; }
  return 'Z';
}
function nextProductCode(cat){
  const prefix = catPrefixFor(cat);
  const re = new RegExp('^'+prefix+'(\\d+)$','i');
  let max = 0;
  getProducts().forEach(p=>{ const m = String(p.code||'').match(re); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return prefix + String(max+1).padStart(3,'0');
}
async function pushProductsBatch(arr){
  if(!CLOUD_ENABLED || !arr.length) return;
  try{
    for(let i=0;i<arr.length;i+=100){
      const { error } = await sb.from('products').upsert(arr.slice(i,i+100).map(productToRow));
      if(error) throw error;
    }
  }catch(e){ console.error('批次寫入雲端失敗', e); toast('⚠ 雲端同步失敗，請檢查網路'); }
}
// 改名時，把已經建檔的商品一起改（避免改了清單、舊商品還掛著錯字）
async function cascadeRename(type, oldV, newV){
  const products = getProducts(); const touched = [];
  products.forEach(p=>{
    if(type==='cats' && p.category===oldV){ p.category = newV; touched.push(p); }
    else if(type==='masters' && p.master===oldV){ p.master = newV; touched.push(p); }
    else if(type==='effects' && (p.effects||[]).includes(oldV)){ p.effects = [...new Set(p.effects.map(e=>e===oldV?newV:e))]; touched.push(p); }
  });
  if(touched.length){ save('products', products); await pushProductsBatch(touched); }
  if(type==='cats'){
    ['catEffects','catPrefix'].forEach(k=>{ if(CONFIG[k][oldV] !== undefined){ CONFIG[k][newV] = CONFIG[k][oldV]; delete CONFIG[k][oldV]; } });
    filterState.cats = filterState.cats.map(c=>c===oldV?newV:c);
  }
  if(type==='effects'){
    Object.keys(CONFIG.catEffects).forEach(k=>{ CONFIG.catEffects[k] = CONFIG.catEffects[k].map(e=>e===oldV?newV:e); });
    filterState.effects = filterState.effects.map(e=>e===oldV?newV:e);
  }
  if(type==='masters') filterState.masters = filterState.masters.map(m=>m===oldV?newV:m);
  return touched.length;
}

function buildIntroText(p){

    `【${p.name}】`,

    p.effects && p.effects.length ? `功效：${p.effects.join('、')}` : '',

}
window.copyIntroText=async function(id, btn){

  try{

    const original = btn.textContent;
    btn.textContent = '✅ 已複製';
    setTimeout(()=>{ btn.textContent = original; }, 1600);
  }catch(e){ alert('複製失敗，請手動選取：\n\n'+text); }
}
async function copyImageUrl(url, btn){
  try{
    const pngBlob = await new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img,0,0);
        canvas.toBlob(b=> b?resolve(b):reject(new Error('轉檔失敗')), 'image/png');
      };
      img.onerror = reject;
      img.src = url;
    });
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': pngBlob }) ]);
    const original = btn.textContent;
    btn.textContent = '✅ 已複製';
    setTimeout(()=>{ btn.textContent = original; }, 1600);
  }catch(e){
    console.error(e);
    toast('⚠ 這個瀏覽器不支援複製圖片，改用長按圖片存檔');
  }
}
window.copyProductImage=async function(id, btn){

}
window.copyProductImageAt=async function(id, idx, btn){
  const p = getProductById(id); if(!p) return;

// ============ 圖片：縮圖、延遲載入、失敗重試 ============
function driveId(url){
  const m = String(url||'').match(/drive\.google\.com\/(?:thumbnail\?id=|uc\?(?:export=\w+&)?id=|file\/d\/|open\?id=)([\w-]+)/) || String(url||'').match(/googleusercontent\.com\/d\/([\w-]+)/);
  return m ? m[1] : null;
}
function imgThumb(url, w){
  const id = driveId(url);
  return id ? `https://lh3.googleusercontent.com/d/${id}=w${w||400}` : url;
}
function imgTag(url, w, extraStyle){
  if(!url) return '';
  const orig = String(url).startsWith('data:') ? '' : ` data-orig="${escA(url)}"`;
  return `<img src="${escA(imgThumb(url,w))}"${orig} loading="lazy" decoding="async" onerror="imgFallback(this)" style="width:100%;height:100%;object-fit:cover;${extraStyle||''}">`;
}
window.imgFallback=function(el){
  const o = el.dataset.orig || '';
  if(o && !el.dataset.tried){
    el.dataset.tried = '1';
    const id = driveId(o);
    el.src = id ? `https://drive.google.com/thumbnail?id=${id}&sz=w400` : o + (o.includes('?')?'&':'?') + 'r=' + Date.now();
    return;
  }
  el.onerror = null; el.style.display = 'none';
  const sp = document.createElement('span'); sp.textContent = '🏺'; sp.style.cssText = 'font-size:22px;opacity:.7;';
  el.parentNode && el.parentNode.appendChild(sp);
};

// 左滑顯示刪除鈕
window.swStart=function(e){
  const card = e.currentTarget, t = e.touches[0];
  if(_swOpen && _swOpen !== card) swClose(_swOpen);
  _sw = { card, x:t.clientX, y:t.clientY, dx:0, locked:null, base: card.classList.contains('sw-open') ? -84 : 0 };
}
window.swMove=function(e){
  if(!_sw) return;
  const t = e.touches[0], dx = t.clientX - _sw.x, dy = t.clientY - _sw.y;
  if(_sw.locked === null){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    _sw.locked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if(_sw.locked === 'h') _sw.card.style.transition = 'none';
  }
  if(_sw.locked !== 'h') return;
  _sw.dx = dx;
  const x = Math.min(0, Math.max(-120, _sw.base + dx));
  _sw.card.style.transform = `translateX(${x}px)`;
}
window.swEnd=function(e){
  if(!_sw) return;
  const s = _sw; _sw = null;
  s.card.style.transition = '';
  if(s.locked !== 'h') return;
  if(s.base + s.dx < -50){ s.card.style.transform = 'translateX(-84px)'; s.card.classList.add('sw-open'); _swOpen = s.card; }
  else { swClose(s.card); }
  s.card.dataset.swiped = '1';
  setTimeout(()=>{ delete s.card.dataset.swiped; }, 350);
}
function swClose(card){ card.style.transform = ''; card.classList.remove('sw-open'); if(_swOpen === card) _swOpen = null; }
window.swTap=function(card,id){
  if(card.dataset.swiped) return;

window.commitDetailEdit=async function(id,k){
  const products = getProducts(); const i = products.findIndex(p=>p.id===id); if(i<0) return;
  const p = { ...products[i] };
  if(k==='effects'){
    p.effects = [...document.querySelectorAll('#de-effects .chip.on')].map(c=>c.textContent);
  } else {
    const v = (document.getElementById('de-'+k)?.value || '').trim();
    if(k==='name'){ if(!v){ toast('⚠ 名稱不能空白'); return; } p.name = v; }
    else if(k==='code'){
      if(!v){ toast('⚠ 編號不能空白'); return; }
      if(products.some((x,j)=>j!==i && String(x.code||'').toUpperCase()===v.toUpperCase())){ toast('⚠ 這個編號已經有其他商品在用'); return; }
      p.code = v;
    }
    else if(k==='price'){ const n = parseInt(v); if(isNaN(n) || n<0){ toast('⚠ 請輸入有效售價'); return; } p.price = n; }
    else p[k] = v;
  }
  products[i] = p; save('products', products);
  refreshDetail(id); refreshProductListQuiet();
  await pushProductToCloud(p);
  await logActivity('編輯商品', `${p.name}（${p.code}）· ${DETAIL_LABELS[k]||k}`);
  toast('✅ 已儲存'+(CLOUD_ENABLED?'（已同步雲端）':''));
}

const _stockTimers = {}, _stockOrig = {};
function applyStock(id,n){
  const products = getProducts(); const i = products.findIndex(p=>p.id===id); if(i<0) return;
  if(_stockOrig[id] === undefined) _stockOrig[id] = products[i].stock;
  products[i].stock = n; save('products', products);
  const inp = document.getElementById('stk-val');
  if(inp){ inp.value = n; inp.style.color = n<=1 ? '#c0392b' : ''; }
  clearTimeout(_stockTimers[id]);
  _stockTimers[id] = setTimeout(async ()=>{
    const p = getProductById(id); if(!p) return;
    const from = _stockOrig[id]; delete _stockOrig[id];
    refreshProductListQuiet();
    await pushProductToCloud(p);
    await logActivity('調整庫存', `${p.name} ${from} → ${p.stock}`);
    toast('✅ 庫存已更新'+(CLOUD_ENABLED?'（已同步雲端）':''));
  }, 600);
}
window.adjStock=function(id,d){ const p = getProductById(id); if(!p) return; applyStock(id, Math.max(0, (parseInt(p.stock)||0) + d)); }
window.setStock=function(id,v){
  const n = parseInt(v);
  if(isNaN(n) || n<0){ toast('⚠ 請輸入有效數量'); const p = getProductById(id); const inp = document.getElementById('stk-val'); if(p && inp) inp.value = p.stock; return; }
  applyStock(id, n);
}
