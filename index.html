<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="佛牌殿">
<title>佛牌殿 POS系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --gold: #d4a843;
  --gold-light: #e8c97a;
  --gold-pale: #f5e9c8;
  --deep: #1a0a2e;
  --deep2: #2d1a4a;
  --deep3: #3d2560;
  --surface: #f8f5f0;
  --surface2: #efe9de;
  --white: #ffffff;
  --text: #1a0a2e;
  --text2: #6b5c7e;
  --text3: #9a8aab;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(26,10,46,0.12);
  --shadow-lg: 0 8px 32px rgba(26,10,46,0.18);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; background: var(--deep); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--surface); position: relative; overflow: hidden; }

/* TOP BAR */
.topbar { background: var(--deep); padding: 44px 20px 16px; flex-shrink: 0; }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; }
.topbar-title { font-family: 'Noto Serif TC', serif; font-size: 18px; color: var(--gold-light); font-weight: 600; letter-spacing: 1px; }
.topbar-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.topbar-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* TAB BAR */
.tabbar { background: var(--deep); display: flex; overflow-x: auto; padding: 0 12px 14px; gap: 6px; flex-shrink: 0; scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: none; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.tab.active { background: var(--gold); color: var(--deep); font-weight: 500; }
.tab:not(.active) { background: rgba(255,255,255,0.07); color: var(--text3); }

/* SCROLL CONTENT */
.content { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.content::-webkit-scrollbar { display: none; }

/* PAGES */
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* SECTION TITLE */
.sec { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin: 16px 0 10px; }
.sec:first-child { margin-top: 0; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.stat-card { background: var(--white); border-radius: var(--radius); padding: 14px; border: 1px solid rgba(26,10,46,0.06); }
.stat-card.accent { background: var(--deep); }
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.stat-card.accent .stat-label { color: rgba(255,255,255,0.5); }
.stat-val { font-size: 22px; font-weight: 500; color: var(--text); font-family: 'Noto Serif TC', serif; }
.stat-card.accent .stat-val { color: var(--gold-light); }
.stat-tag { font-size: 11px; margin-top: 4px; }
.tag-up { color: #2d7a4a; }
.tag-down { color: #c0392b; }
.tag-warn { color: #d4870a; }

/* ORDER CARD */
.order-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); cursor: pointer; transition: all 0.15s; }
.order-card:active { transform: scale(0.98); }
.order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.order-name { font-size: 15px; font-weight: 500; color: var(--text); }
.order-id { font-size: 11px; color: var(--text3); margin-top: 1px; }
.order-info { font-size: 12px; color: var(--text2); margin-bottom: 6px; line-height: 1.6; }
.order-items-text { font-size: 13px; color: var(--text); }
.alert-pill { display: inline-flex; align-items: center; gap: 4px; background: #fff0eb; color: #c0392b; font-size: 11px; padding: 4px 8px; border-radius: 6px; margin-top: 8px; }

/* BADGES */
.badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.b-ship { background: #e8f4fb; color: #1a6fa8; }
.b-pick { background: #fef3e2; color: #a06010; }
.b-done { background: #e8f5e9; color: #2d7a4a; }
.b-chain { background: #fce4ec; color: #a0294a; }
.b-cancel { background: #fce4e4; color: #c0392b; }
.b-return { background: #f3e8ff; color: #6b35a0; }

/* FILTER CHIPS */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(26,10,46,0.15); background: var(--white); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.chip.on { background: var(--deep); color: var(--gold-light); border-color: var(--deep); }

/* FORMS */
.form-block { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; font-weight: 500; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 11px 14px; border: 1px solid rgba(26,10,46,0.15); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Noto Sans TC', sans-serif; background: var(--white); color: var(--text); outline: none; transition: border 0.2s; -webkit-appearance: none; appearance: none; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-textarea { resize: none; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* BUTTONS */
.btn { padding: 13px 20px; border-radius: var(--radius); font-size: 15px; font-family: 'Noto Sans TC', sans-serif; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--deep); color: var(--gold-light); width: 100%; margin-top: 8px; }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-gold { background: var(--gold); color: var(--deep); width: 100%; margin-top: 8px; }
.btn-sm { padding: 7px 14px; font-size: 13px; border-radius: var(--radius-sm); }

/* PRODUCT CARD */
.product-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); display: flex; gap: 12px; cursor: pointer; transition: all 0.15s; }
.product-card:active { transform: scale(0.98); }
.product-img { width: 58px; height: 58px; border-radius: 10px; background: linear-gradient(135deg, var(--deep), var(--deep3)); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; }
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.product-meta { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.product-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ptag { font-size: 11px; padding: 2px 7px; border-radius: 4px; }
.ptag-effect { background: #ede8f8; color: #4a2580; }
.ptag-pos { background: #e8f5e9; color: #1a5a2e; }
.ptag-neg { background: #1a0a2e; color: #e8c97a; }
.price-tag { font-size: 14px; font-weight: 500; color: var(--deep); margin-top: 6px; }
.stock-tag { font-size: 12px; color: var(--text3); }
.stock-low { color: #c0392b; font-weight: 500; }

/* CUSTOMER CARD */
.customer-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); cursor: pointer; }
.customer-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--deep2); color: var(--gold-light); display: flex; align-items: center; justify-content: center; font-size: 15px; font-family: 'Noto Serif TC', serif; flex-shrink: 0; }
.customer-stat { text-align: center; }
.customer-stat-val { font-size: 18px; font-weight: 500; color: var(--text); font-family: 'Noto Serif TC', serif; }
.customer-stat-label { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* CHART */
.chart-wrap { background: var(--white); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; border: 1px solid rgba(26,10,46,0.06); }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { width: 100%; border-radius: 5px 5px 0 0; background: var(--surface2); min-height: 4px; transition: height 0.6s; }
.bar.curr { background: var(--gold); }
.bar-lbl { font-size: 10px; color: var(--text3); }
.bar-val-t { font-size: 10px; font-weight: 500; color: var(--text2); }
.bar-val-t.curr { color: var(--gold); }

/* RANKING */
.rank-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(26,10,46,0.06); }
.rank-num { width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; }
.rank-num.r1 { background: var(--gold); color: var(--deep); }
.rank-name { flex: 1; font-size: 13px; color: var(--text); }
.rank-sales { font-size: 13px; font-weight: 500; color: var(--text); }

/* SOURCE PIE LEGEND */
.source-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.source-item { display: flex; align-items: center; gap: 8px; }
.source-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.source-name { font-size: 12px; color: var(--text2); flex: 1; }
.source-pct { font-size: 12px; font-weight: 500; color: var(--text); }

/* MODAL OVERLAY */
.modal-overlay { position: absolute; inset: 0; background: rgba(10,4,20,0.6); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet { background: var(--white); border-radius: 20px 20px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.25s; }
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--surface2); margin: 0 auto 16px; }
.modal-title { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 16px; }

/* TOAST */
.toast { position: absolute; top: 100px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--deep); color: var(--gold-light); padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 200; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* SEARCH BAR */
.search-bar { position: relative; margin-bottom: 14px; }
.search-bar input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid rgba(26,10,46,0.15); border-radius: 10px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif; background: var(--white); color: var(--text); outline: none; }
.search-bar input:focus { border-color: var(--gold); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }

/* FAB */
.fab { position: absolute; bottom: 80px; right: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--gold); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 16px rgba(212,168,67,0.4); z-index: 50; transition: all 0.2s; }
.fab:active { transform: scale(0.92); }

/* DIVIDER */
.divider { height: 1px; background: rgba(26,10,46,0.08); margin: 12px 0; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-state .emoji { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* PRODUCT DETAIL ROWS */
.detail-row { display: flex; padding: 9px 0; border-bottom: 1px solid rgba(26,10,46,0.06); }
.detail-key { font-size: 13px; color: var(--text3); width: 90px; flex-shrink: 0; }
.detail-val { font-size: 13px; color: var(--text); flex: 1; }

/* PHOTO UPLOAD */
.photo-upload { width: 80px; height: 80px; border-radius: 10px; border: 1.5px dashed rgba(26,10,46,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; background: var(--surface); }
.photo-preview { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; cursor: pointer; }

/* STATUS FILTER ROW */
.status-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; scrollbar-width: none; }
.status-row::-webkit-scrollbar { display: none; }

/* SWITCH */
.switch { display: flex; background: var(--surface2); border-radius: 8px; padding: 3px; gap: 3px; }
.switch-opt { flex: 1; padding: 6px; border-radius: 6px; border: none; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; background: none; color: var(--text2); transition: all 0.15s; text-align: center; }
.switch-opt.on { background: var(--deep); color: var(--gold-light); font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="topbar-title">🏮 佛牌殿管理系統</div>
        <div class="topbar-sub" id="topbar-date">載入中...</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="topbar-btn" id="role-badge-btn" onclick="promptSwitchRole()" style="width:auto;padding:0 10px;font-size:11px;color:var(--gold-light);">身份</button>
        <button class="topbar-btn" onclick="showNotif()" style="color:#e8c97a;font-size:18px;">🔔</button>
      </div>
    </div>
  </div>
  
  <div class="tabbar" id="tabbar">
    <button class="tab active" data-page="home">首頁</button>
    <button class="tab" data-page="orders">訂單</button>
    <button class="tab" data-page="new-order">建立訂單</button>
    <button class="tab" data-page="filter">商品篩選</button>
    <button class="tab" data-page="products">商品庫</button>
    <button class="tab" data-page="customers">客戶</button>
    <button class="tab" data-page="report">報表</button>
    <button class="tab" data-page="settings">權限設定</button>
  </div>
  
  <div class="content" id="content">
    <!-- HOME -->
    <div class="page active" id="page-home"></div>
    <!-- ORDERS -->
    <div class="page" id="page-orders"></div>
    <!-- NEW ORDER -->
    <div class="page" id="page-new-order"></div>
    <!-- FILTER -->
    <div class="page" id="page-filter"></div>
    <!-- PRODUCTS -->
    <div class="page" id="page-products"></div>
    <!-- CUSTOMERS -->
    <div class="page" id="page-customers"></div>
    <!-- REPORT -->
    <div class="page" id="page-report"></div>
    <!-- SETTINGS -->
    <div class="page" id="page-settings"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle"></div>
      <div id="modal-content"></div>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

  <!-- ROLE PICKER -->
  <div class="modal-overlay" id="role-picker" style="display:none;background:rgba(26,10,46,0.92);align-items:center;justify-content:center;">
    <div class="modal-sheet" style="border-radius:16px;max-width:340px;width:88%;">
      <div id="role-picker-content"></div>
    </div>
  </div>
</div>

<script>
// ============ DATA ============
const CATS = ['坤平將軍','坤昌','崇迪佛','佛祖','藥師佛','師傅自身','巴拉吉','人緣鳥','姐姐牌','路過','天靈蓋','狐仙','器官','女王佛','五古佛','伊霸女神','魅力之神','幽魂娜娜','大地之母','拉胡天神','象神','四面神','蝴蝶牌','芭蕉精','招財女神','澤鍍金','必打掩面佛','外星人佛牌','陶威素灣','財龜','座山佛','符館','古曼童','供奉尊','魯士','二哥豐','戒指','山神','愛情和合','帕嬰','鬼財神','馬食能','五眼四耳','周邊聖物','充電寶','希瓦利','天神','大鵬金翅鳥','貓路過','樹精','魂帕傭','人緣油','南平女神','烏巴庫','哈努曼','手鍊','飛頭降','人魚','蛇精','路翁','符管','其他'];
const EFFECTS = ['招財','人緣','桃花','事業運','愛情','保護','化解小人','健康','逢凶化吉','財運','好運','催旺','開運','增加魅力','夫妻感情','考試順利','出行平安','生意興隆','升官','貴人運'];
const MASTERS = ['月亮師傅','龍婆崇','阿贊素威','帕甘寺','龍婆坤','龍婆本','大城府寺廟','清邁古廟','曼谷四面佛','阿贊奴','龍婆帕','其他'];
const STATUS_LIST = ['全部','待寄出','待選鍊子','待自取','已寄出','取消','退貨'];
const STATUS_BADGE = { '待寄出':'b-ship','待選鍊子':'b-chain','待自取':'b-pick','已寄出':'b-done','取消':'b-cancel','退貨':'b-return' };
const SHIP_LIST = ['門市自取','711','黑貓'];
const SOURCE_LIST = ['門市','社群','LINE官方','蝦皮'];
const GIFT_LIST = ['佛牌鍊（標準）','佛牌鍊（金色）','佛牌鍊（銀色）','佛牌鍊（黑色）','不附贈'];

// ============ 雲端商品資料庫設定 (Supabase) ============
// 建好 Supabase 專案、跑完 supabase-schema.sql 後，把下面三個值換成你自己的。
// SUPABASE_URL / SUPABASE_ANON_KEY 在 Supabase 後台「Project Settings > API」可以找到
// TENANT_ID 是跑完 schema.sql 後查詢 tenants 表格拿到的佛牌殿 id
const SUPABASE_URL = 'https://roxwskdpnsctoaflcomt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJveHdza2RwbnNjdG9hZmxjb210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0Mjk3MDAsImV4cCI6MjEwNDAwNTcwMH0.CflNz8IOx85zo-apNjJkUBISqXYGVpu5-LJ5DDBPyxw';
const TENANT_ID = 'dbf9fcd3-110a-4dde-8ef9-40c2f89967a9';
const CLOUD_ENABLED = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_') && !TENANT_ID.startsWith('YOUR_');
const sb = CLOUD_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ============ 身份與權限（接 Supabase Auth 真帳號登入）============
const DEFAULT_PERMISSIONS = { staff: { 'orders':true, 'new-order':true, 'filter':true, 'products':true, 'customers':true, 'report':false } };
let currentUser = null;     // Supabase Auth 的 user 物件
let currentProfile = null;  // profiles 表的資料（含 role, name, tenant_id...）
let currentRole = null;     // 'admin' | 'staff' | null（尚未登入）
let PERMISSIONS = load('permissions') || DEFAULT_PERMISSIONS;

function load(k) { try { const r=localStorage.getItem('bpd_'+k); return r?JSON.parse(r):null; } catch(e){return null;} }
function save(k,d) { try { localStorage.setItem('bpd_'+k, JSON.stringify(d)); } catch(e){} }

// 把 Supabase 資料表格式跟系統原本的商品物件格式互轉
function rowToProduct(r){ return { id:r.id, code:r.code, category:r.category, name:r.name, type:r.type, master:r.master, year:r.year, stock:r.stock, price:r.price, effects:r.effects||[], material:r.material, feature:r.feature, image:r.image }; }
function productToRow(p){ return { id:p.id, tenant_id:TENANT_ID, code:p.code, category:p.category, name:p.name, type:p.type, master:p.master, year:String(p.year), stock:p.stock, price:p.price, effects:p.effects, material:p.material, feature:p.feature, image:p.image, updated_by:'' }; }

// 開機時從雲端把最新商品資料抓下來，寫進本機快取（localStorage），
// 這樣所有頁面原本同步讀取 getProducts() 的寫法都不用改，
// 只要每次開啟 App / 下拉刷新時都會拿到雲端最新的庫存與商品清單。
async function syncProductsFromCloud(){
  if(!CLOUD_ENABLED) return false;
  try{
    const { data, error } = await sb.from('products').select('*').eq('tenant_id', TENANT_ID).order('updated_at',{ascending:false});
    if(error) throw error;
    save('products', data.map(rowToProduct));
    return true;
  }catch(e){ console.error('雲端商品同步失敗，改用本機資料', e); return false; }
}

// 商品新增/庫存更新時，寫回雲端（其他人下次開啟或下拉刷新就會看到）
async function pushProductToCloud(p){
  if(!CLOUD_ENABLED) return;
  try{ const { error } = await sb.from('products').upsert(productToRow(p)); if(error) throw error; }
  catch(e){ console.error('寫入雲端失敗，稍後會在下次同步時補上', e); toast('⚠ 雲端同步失敗，請檢查網路'); }
}

function orderToRow(o){ return { id:o.id, tenant_id:TENANT_ID, order_date:o.date, customer:o.customer, phone:o.phone, shipping:o.shipping, shipping_detail:o.shippingDetail, items:o.items, gift:o.gift, staff:o.staff, source:o.source, status:o.status, note:o.note }; }

// 一次把「這支裝置」本機現有的商品/訂單/客戶全部上傳到雲端（upsert，不會重複）
// 用途：舊資料或是在雲端連上之前就手動建立的資料，補一次同步。
window.migrateLocalToCloud=async function(){
  if(!CLOUD_ENABLED){ toast('⚠ 尚未設定雲端資料庫'); return; }
  toast('⬆️ 上傳中，請稍候...');
  try{
    const products=getProducts(), orders=getOrders(), customers=getCustomers();
    for(const p of products) await pushProductToCloud(p);
    for(const c of customers) await pushCustomerToCloud(c);
    for(const o of orders) await pushOrderToCloud(o);
    toast(`✅ 已上傳 ${products.length} 商品、${orders.length} 訂單、${customers.length} 客戶`);
    await syncAllFromCloud();
    renderPage(currentPage||'home');
  }catch(e){ console.error(e); toast('⚠ 上傳過程發生錯誤，請檢查網路後再試一次'); }
}

async function syncAllFromCloud(){
  if(!CLOUD_ENABLED) return;
  await Promise.all([syncProductsFromCloud(), syncOrdersFromCloud(), syncCustomersFromCloud(), syncPermissionsFromCloud()]);
}

async function syncPermissionsFromCloud(){
  if(!CLOUD_ENABLED) return false;
  try{
    const { data, error } = await sb.from('settings').select('*').eq('tenant_id', TENANT_ID).maybeSingle();
    if(error) throw error;
    if(data && data.permissions){ PERMISSIONS = data.permissions; save('permissions', PERMISSIONS); }
    return true;
  }catch(e){ console.error('雲端權限同步失敗，改用本機設定', e); return false; }
}
async function pushPermissionsToCloud(){
  if(!CLOUD_ENABLED) return;
  try{ const { error } = await sb.from('settings').upsert({ tenant_id:TENANT_ID, permissions:PERMISSIONS }); if(error) throw error; }
  catch(e){ console.error('權限寫入雲端失敗', e); toast('⚠ 權限雲端同步失敗，請檢查網路'); }
}

function getProducts(){ return load('products')||[]; }
function getOrders(){ return load('orders')||[]; }
function getCustomers(){ return load('customers')||[]; }
function getStaff(){ return load('staff')||[]; }

function getProductById(id){ return getProducts().find(p=>p.id===id)||null; }
function getProductName(id){ const p=getProductById(id); return p?p.name:id; }

function genOrderId(){
  const orders=getOrders();
  const n = orders.length ? parseInt(orders[0].id.replace('ORD',''))+1 : 2025001;
  return 'ORD'+String(n).padStart(7,'0');
}

// ============ UI HELPERS ============
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function openModal(html){ 
  document.getElementById('modal-content').innerHTML=html; 
  document.getElementById('modal').classList.add('open'); 
}
function closeModal(e){ 
  if(e && e.target!==document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open'); 
}
window._closeModal=function(){ document.getElementById('modal').classList.remove('open'); }

function chip(label, key, arr, onToggle){
  return `<span class="chip${arr.includes(label)?' on':''}" onclick="${onToggle}('${label.replace(/'/g,"\\'")}',this)">${label}</span>`;
}

function selectModal(title, options, onSelect, allowNew=false){
  const opts = options.map(o=>`<div class="order-card" style="padding:12px 14px;margin-bottom:6px;" onclick="_selectModalItem('${o.replace(/'/g,"\\'")}','${onSelect}')">${o}</div>`).join('');
  const newBtn = allowNew ? `<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="_addNewOption('${onSelect}')">+ 新增選項</button>` : '';
  openModal(`<div class="modal-title">${title}</div>${opts}${newBtn}`);
}
window._selectModalItem=function(val, fn){ window._closeModal(); if(window[fn]) window[fn](val); }
window._addNewOption=function(fn){ const v=prompt('輸入新選項：'); if(v&&v.trim()) { if(window[fn]) window[fn](v.trim()); } }

// ============ 身份與權限 ============
function canAccess(page){
  if(page==='home') return true;
  if(currentRole==='admin') return true;
  if(currentRole==='staff') return PERMISSIONS.staff?.[page] !== false && page!=='settings';
  return false; // 尚未登入
}

function applyRolePermissions(){
  document.querySelectorAll('.tab').forEach(t=>{
    const page = t.dataset.page;
    const allowed = page==='settings' ? currentRole==='admin' : canAccess(page);
    t.style.display = allowed ? '' : 'none';
  });
  const badge = document.getElementById('role-badge-btn');
  if(badge) badge.textContent = currentRole==='admin' ? `👑 ${currentProfile?.name||'管理員'}` : (currentRole==='staff' ? `🧑‍💼 ${currentProfile?.name||'客服/門市'}` : '身份');
}

// ---- 登入畫面 ----
function renderLoginForm(errorMsg){
  document.getElementById('role-picker-content').innerHTML = `
    <div class="modal-title" style="text-align:center;">佛牌殿管理系統登入</div>
    ${errorMsg?`<div style="background:rgba(192,57,43,0.1);color:#c0392b;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:10px;text-align:center;">${errorMsg}</div>`:''}
    <input class="form-input" type="email" id="login-email" placeholder="Email" style="margin-bottom:10px;" autocomplete="username">
    <input class="form-input" type="password" id="login-pw" placeholder="密碼" style="margin-bottom:14px;" autocomplete="current-password">
    <button class="btn btn-gold" onclick="doLogin()" id="login-btn">登入</button>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:14px;">帳號由管理員建立，如尚未有帳號請聯繫店長</div>
  `;
  document.getElementById('login-pw')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
window.doLogin=async function(){
  const email = document.getElementById('login-email')?.value?.trim();
  const password = document.getElementById('login-pw')?.value;
  if(!email||!password){ renderLoginForm('請輸入 Email 和密碼'); return; }
  const btn = document.getElementById('login-btn'); if(btn){ btn.disabled=true; btn.textContent='登入中...'; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ renderLoginForm('登入失敗：帳號或密碼錯誤'); return; }
  const ok = await loadCurrentProfile(data.user);
  if(!ok) return; // loadCurrentProfile 內已處理錯誤訊息與登出
  document.getElementById('role-picker').style.display='none';
  applyRolePermissions();
  await syncAllFromCloud();
  await logActivity('登入', '');
  navigateTo('home');
}
window.doLogout=async function(){
  await sb.auth.signOut();
  currentUser=null; currentProfile=null; currentRole=null;
  renderLoginForm();
  document.getElementById('role-picker').style.display='flex';
}
window.promptSwitchRole=function(){
  openModal(`
    <div class="modal-title">帳號</div>
    <div style="font-size:14px;margin-bottom:4px;">${currentProfile?.name||''}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:18px;">${currentProfile?.email||''} · ${currentRole==='admin'?'管理員':'客服/門市人員'}</div>
    <button class="btn btn-secondary" style="width:100%;" onclick="_closeModal();doLogout()">登出</button>
  `);
}

// 登入成功後，抓這個帳號在 profiles 表裡的角色/租戶資料
async function loadCurrentProfile(user){
  currentUser = user;
  try{
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(error) throw error;
    if(!data){ await sb.auth.signOut(); renderLoginForm('這個帳號尚未設定權限，請聯繫管理員'); return false; }
    if(!data.active){ await sb.auth.signOut(); renderLoginForm('這個帳號已被停用，請聯繫管理員'); return false; }
    currentProfile = data;
    currentRole = data.role;
    return true;
  }catch(e){
    console.error(e);
    await sb.auth.signOut();
    renderLoginForm('讀取帳號資料失敗，請重新登入');
    return false;
  }
}

async function logActivity(action, detail){
  if(!CLOUD_ENABLED || !currentUser) return;
  try{ await sb.from('activity_log').insert({ tenant_id:TENANT_ID, user_id:currentUser.id, user_name:currentProfile?.name||'', action, detail:detail||'' }); }
  catch(e){ console.error('寫入操作紀錄失敗', e); }
}

// ============ NAVIGATION ============
let currentPage = 'home';
document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  const page = btn.dataset.page;
  navigateTo(page);
});

function navigateTo(page){
  if(!canAccess(page)){ toast('⚠ 你的身份沒有這個頁面的權限'); return; }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+page));
  currentPage = page;
  document.getElementById('content').scrollTop = 0;
  renderPage(page);
}

function renderPage(page){
  if(!canAccess(page)) page='home';
  const el = document.getElementById('page-'+page);
  if(!el) return;
  const renderers = { home: renderHome, orders: renderOrders, 'new-order': renderNewOrder, filter: renderFilter, products: renderProducts, customers: renderCustomers, report: renderReport, settings: renderSettings };
  if(renderers[page]) el.innerHTML = renderers[page]();
  bindPageEvents(page);
}

// ============ HOME ============
function renderHome(){
  const orders = getOrders();
  const todayShip = orders.filter(o=>o.status==='待寄出'||o.status==='待選鍊子');
  const thisMonth = orders.filter(o=>o.date.startsWith('2025-01'));
  const totalSales = thisMonth.reduce((sum,o)=>{
    return sum + o.items.reduce((s,it)=>{ const p=getProductById(it.productId); return s+(p?p.price*it.qty:0); },0);
  }, 0);
  
  const rankMap = {};
  thisMonth.forEach(o=>o.items.forEach(it=>{ const p=getProductById(it.productId); if(p){ rankMap[p.category]=(rankMap[p.category]||0)+p.price*it.qty; } }));
  const ranking = Object.entries(rankMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  
  const rankHTML = ranking.map((r,i)=>`
    <div class="rank-item">
      <div class="rank-num${i===0?' r1':''}">${i+1}</div>
      <div class="rank-name">${r[0]}</div>
      <div class="rank-sales">$${r[1].toLocaleString()}</div>
    </div>`).join('');
  
  const shipCards = todayShip.slice(0,3).map(o=>{
    const items = o.items.map(it=>`${getProductName(it.productId)} ×${it.qty}`).join('、');
    const noGift = o.items.some(it=>{ const p=getProductById(it.productId); return p&&p.category!=='手鍊'&&p.category!=='符管'; }) && !o.gift;
    return `<div class="order-card" onclick="openOrderDetail('${o.id}')">
      <div class="order-head">
        <div><div class="order-name">${o.customer}</div><div class="order-id">#${o.id}</div></div>
        <span class="badge ${STATUS_BADGE[o.status]||'b-ship'}">${o.status}</span>
      </div>
      <div class="order-info">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail} · ${o.phone}</div>
      <div class="order-items-text">${items}</div>
      ${noGift?'<div class="alert-pill">⚠ 未填佛牌鍊，請確認</div>':''}
    </div>`;
  }).join('');

  return `
    <div style="display:flex;align-items:center;gap:8px;background:${CLOUD_ENABLED?'rgba(45,122,74,0.08)':'rgba(192,57,43,0.08)'};border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:${CLOUD_ENABLED?'#2d7a4a':'#c0392b'};">
      <span style="flex:1;">${CLOUD_ENABLED?'☁️ 雲端同步已啟用，商品/訂單/客戶全部多人同步':'⚠️ 尚未連接雲端資料庫，資料只存在這支裝置'}</span>
      ${CLOUD_ENABLED?'<button class="topbar-btn" style="width:auto;padding:4px 10px;background:rgba(45,122,74,0.15);color:#2d7a4a;font-size:11px;" onclick="migrateLocalToCloud()">上傳本機資料</button>':''}
    </div>
    <div class="stat-grid">
      <div class="stat-card accent">
        <div class="stat-label">本月銷售額</div>
        <div class="stat-val">$${totalSales.toLocaleString()}</div>
        <div class="stat-tag tag-up">↑ 持續成長中</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日待出貨</div>
        <div class="stat-val" style="color:#c0392b;">${todayShip.length} 筆</div>
        <div class="stat-tag tag-warn">需處理</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本月訂單數</div>
        <div class="stat-val">${thisMonth.length}</div>
        <div class="stat-tag tag-up">筆訂單</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">待選鍊子</div>
        <div class="stat-val" style="color:#a06010;">${orders.filter(o=>o.status==='待選鍊子').length} 筆</div>
        <div class="stat-tag tag-warn">待確認</div>
      </div>
    </div>
    <div class="sec">今日待出貨</div>
    ${shipCards || '<div class="empty-state"><div class="emoji">✅</div><p>今日無待出貨訂單</p></div>'}
    <div class="sec" style="margin-top:20px;">本月銷售排行</div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;border:1px solid rgba(26,10,46,0.06);">

window.submitOrder=async function(){
  const customer=document.getElementById('no-customer')?.value?.trim();
  const phone=document.getElementById('no-phone')?.value?.trim();
  const shipping=document.getElementById('no-shipping')?.value;
  if(!customer){ toast('⚠ 請填入訂購人姓名'); return; }
  if(!phone){ toast('⚠ 請填入電話'); return; }
  if(!selectedProducts.length){ toast('⚠ 請至少選擇一項商品'); return; }
  
  const orders=getOrders();
  const newId=genOrderId();
  const hasBuddha=selectedProducts.some(p=>!['手鍊','符管','周邊聖物','充電寶'].includes(p.category));
  const gift=document.getElementById('no-gift')?.value||'';
  
  const newOrderRecord = {
    id:newId,
    date:new Date().toISOString().slice(0,10),
    customer,phone,shipping,
    shippingDetail:document.getElementById('no-ship-detail')?.value||'',
    items:selectedProducts.map(p=>({productId:p.id,qty:p.qty})),
    gift,
    staff:document.getElementById('no-staff')?.value||getStaff()[0],
    source:newOrder.source||'門市',
    status:'待寄出',
    note:document.getElementById('no-note')?.value||''
  };
  orders.unshift(newOrderRecord);
  save('orders',orders);
  await pushOrderToCloud(newOrderRecord);
  
  // Update stock
  const products=getProducts();
  const changedProducts=[];
  selectedProducts.forEach(sp=>{ const i=products.findIndex(p=>p.id===sp.id); if(i>=0){ products[i].stock=Math.max(0,products[i].stock-sp.qty); changedProducts.push(products[i]); } });
  save('products',products);
  for(const p of changedProducts) await pushProductToCloud(p);
  
  // Save/update customer
  const customers=getCustomers();
  const ci=customers.findIndex(c=>c.phone===phone);
  let savedCustomer;
  if(ci<0){ savedCustomer={id:'C'+Date.now(),name:customer,phone,shipping,shippingDetail:document.getElementById('no-ship-detail')?.value||''}; customers.push(savedCustomer); }
  else { savedCustomer=customers[ci]; }
  save('customers',customers);
  await pushCustomerToCloud(savedCustomer);
  await logActivity('建立訂單', `#${newId} ${customer}`);
  
  selectedProducts=[];
  newOrder={ customer:'',phone:'',shipping:'',shippingDetail:'',items:[],gift:'',staff:'',source:'',note:'' };
  
  if(hasBuddha&&!gift) toast('⚠ 訂單建立！注意：未填佛牌鍊');
  else toast('✅ 訂單 #'+newId+' 建立成功！');
  navigateTo('orders');
}

let filterState = { q:'', cats:[], effects:[], type:'不限', budgetMin:'', budgetMax:'', master:'' };
function renderFilter(){
  const catChips = CATS.slice(0,20).map(c=>`<span class="chip${filterState.cats.includes(c)?' on':''}" onclick="toggleFilter('cats','${c}',this)">${c}</span>`).join('') + `<span class="chip" onclick="showAllCats()">更多...</span>`;
  const effChips = EFFECTS.map(e=>`<span class="chip${filterState.effects.includes(e)?' on':''}" onclick="toggleFilter('effects','${e}',this)">${e}</span>`).join('');
  
  let results = [];
  const hasFilter = filterState.q||filterState.cats.length||filterState.effects.length||filterState.type!=='不限'||filterState.budgetMin||filterState.budgetMax;
  if(hasFilter){
    results = getProducts().filter(p=>{
      if(filterState.q && !(p.name.includes(filterState.q)||p.code.includes(filterState.q)||p.category.includes(filterState.q)||(p.master||'').includes(filterState.q))) return false;
      if(filterState.cats.length && !filterState.cats.includes(p.category)) return false;
      if(filterState.effects.length && !filterState.effects.some(e=>p.effects.includes(e))) return false;
      if(filterState.type!=='不限' && p.type!==filterState.type) return false;
      if(filterState.budgetMin && p.price<parseInt(filterState.budgetMin)) return false;
      if(filterState.budgetMax && p.price>parseInt(filterState.budgetMax)) return false;
      return true;
    });
  }
  
  const resultHTML = hasFilter ? (results.length ? results.map((p,i)=>`
    <div class="product-card" style="align-items:flex-start;">
      <div class="product-img" style="font-size:22px;overflow:hidden;" onclick="openProductDetail('${p.id}')">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;">`:'🏺'}</div>
      <div style="flex:1;">
        <div class="product-name" onclick="openProductDetail('${p.id}')">${p.name}</div>
        <div class="product-meta">${p.master||''} · ${p.year||''}年 · 庫存：${p.stock}</div>
        <div class="product-tags">${p.effects.slice(0,3).map(e=>`<span class="ptag ptag-effect">${e}</span>`).join('')}${p.type==='陰牌'?'<span class="ptag ptag-neg">陰牌</span>':'<span class="ptag ptag-pos">正牌</span>'}</div>
        <div class="price-tag">$${p.price.toLocaleString()}</div>
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn btn-primary btn-sm" style="flex:1;margin-top:0;" id="cp-text-${i}" onclick="copyIntroText('${p.id}', this)">📋 複製介紹</button>
          ${p.image?`<button class="btn btn-secondary btn-sm" style="flex:1;margin-top:0;" id="cp-img-${i}" onclick="copyProductImage('${p.id}', this)">🖼 複製圖片</button>`:''}
        </div>
      </div>
    </div>`).join('') : `<div class="empty-state"><div class="emoji">🔍</div><p>無符合商品</p></div>`) : '';

  return `
    <div class="search-bar" style="margin-bottom:12px;"><span class="search-icon">🔍</span><input type="text" placeholder="輸入商品名稱、編號或種類快速查詢..." id="f-q" value="${filterState.q}" oninput="setFilterQ(this.value)"></div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 10px;">預算範圍 (TWD)</div>
      <div class="form-row">
        <input class="form-input" type="number" placeholder="最低" id="f-min" value="${filterState.budgetMin}">
        <input class="form-input" type="number" placeholder="最高" id="f-max" value="${filterState.budgetMax}">
      </div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 10px;">正牌 / 陰牌</div>
      <div class="switch">
        <button class="switch-opt${filterState.type==='不限'?' on':''}" onclick="setFilterType('不限')">不限</button>
        <button class="switch-opt${filterState.type==='正牌'?' on':''}" onclick="setFilterType('正牌')">正牌</button>
        <button class="switch-opt${filterState.type==='陰牌'?' on':''}" onclick="setFilterType('陰牌')">陰牌</button>
      </div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 10px;">商品種類</div>
      <div class="chip-row">${catChips}</div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 10px;">功效需求</div>
      <div class="chip-row">${effChips}</div>
    </div>
    <button class="btn btn-gold" onclick="runFilter()">搜尋符合商品</button>

// ---- 客服用：一鍵複製介紹文字 / 商品圖片，方便貼到 LINE 聊天室 ----
function buildIntroText(p){
  const lines = [
    `【${p.name}】`,
    `編號：${p.code}`,
    p.master ? `師傅/寺廟：${p.master}` : '',
    p.effects && p.effects.length ? `功效：${p.effects.join('、')}` : '',
    p.material ? `材料：${p.material}` : '',
    p.feature ? `特色：${p.feature}` : '',
    `價格：$${(p.price||0).toLocaleString()}`,
    `目前庫存：${p.stock>0 ? p.stock+' 件' : '缺貨中'}`,
  ];
  return lines.filter(Boolean).join('\n');
}
window.copyIntroText=async function(id, btn){
  const p = getProductById(id); if(!p) return;
  const text = buildIntroText(p);
  try{
    await navigator.clipboard.writeText(text);
    const original = btn.textContent;
    btn.textContent = '✅ 已複製';
    setTimeout(()=>{ btn.textContent = original; }, 1600);
  }catch(e){ alert('複製失敗，請手動選取：\n\n'+text); }
}
window.copyProductImage=async function(id, btn){
  const p = getProductById(id); if(!p||!p.image) return;
  try{
    // 先轉成 PNG，因為部分瀏覽器（尤其 Chrome）複製圖片到剪貼簿只接受 image/png
    const pngBlob = await new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img,0,0);
        canvas.toBlob(b=> b?resolve(b):reject(new Error('轉檔失敗')), 'image/png');
      };
      img.onerror = reject;
      img.src = p.image;
    });
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': pngBlob }) ]);
    const original = btn.textContent;
    btn.textContent = '✅ 已複製';
    setTimeout(()=>{ btn.textContent = original; }, 1600);
  }catch(e){
    console.error(e);

  const products=getProducts(); const i=products.findIndex(p=>p.id===id);
  if(i>=0){ products[i].stock=val; save('products',products); await pushProductToCloud(products[i]); await logActivity('調整庫存', `${products[i].name} → ${val}`); }
  _closeModal(); toast('✅ 庫存已更新'+(CLOUD_ENABLED?'（已同步雲端）':'')); renderPage('products');
}

window.previewPhoto=function(input){
  if(!input.files||!input.files[0]) return;
  const r=new FileReader();
  r.onload=function(e){ 
    const img=document.getElementById('np-photo-preview');
    img.src=e.target.result; img.style.display='block';
    document.querySelector('.photo-upload').style.display='none';
  };
  r.readAsDataURL(input.files[0]);
}

window.saveNewProduct=async function(){
  const name=document.getElementById('np-name')?.value?.trim();
  const price=parseInt(document.getElementById('np-price')?.value);
  const cat=document.getElementById('np-cat')?.value;
  if(!name){ toast('⚠ 請填入商品名稱'); return; }
  if(!price||isNaN(price)){ toast('⚠ 請填入售價'); return; }
  if(!cat||cat==='__new__'){ toast('⚠ 請選擇種類'); return; }
  
  const type=document.getElementById('np-pos')?.classList.contains('on')?'正牌':'陰牌';
  const master=document.getElementById('np-master')?.value||'';
  const year=document.getElementById('np-year')?.value||new Date().getFullYear().toString();
  const stock=parseInt(document.getElementById('np-stock')?.value)||1;
  const material=document.getElementById('np-material')?.value||'';
  const feature=document.getElementById('np-feature')?.value||'';
  const effects=[...document.querySelectorAll('#np-effects .chip.on')].map(c=>c.textContent);
  const photoFile=document.getElementById('np-photo-file');
  const photoPreview=document.getElementById('np-photo-preview');
  const image=photoPreview?.style.display!=='none'?photoPreview?.src||'':'';
  
  const catCode=cat.substring(0,2).toUpperCase();
  const ym=year.slice(-2)+String(new Date().getMonth()+1).padStart(2,'0');
  const products=getProducts();
  const sameCode=products.filter(p=>p.code.startsWith(catCode)).length+1;
  const code=`${catCode}${year}-${String(sameCode).padStart(3,'0')}`;
  
  const newProduct = { id:catCode+Date.now(), code, category:cat, name, type, master, year, stock, price, effects, material, feature, image };
  products.unshift(newProduct);
  save('products',products);
  await pushProductToCloud(newProduct);
  await logActivity('新增商品', `${newProduct.name}（${code}）`);

  if(master==='__new__'){ const m=load('masters')||MASTERS; if(!m.includes(master)) { m.push(master); save('masters',m); } }

  _closeModal(); toast('✅ 商品建檔成功！'+(CLOUD_ENABLED?'（已同步雲端）':'')); renderPage('products');
}

// ============ REPORT ============
function renderReport(){
  const orders = getOrders();
  const months = ['10月','11月','12月','1月'];
  const monthSales = [72000, 89000, 104000, 128400];
  const maxSale = Math.max(...monthSales);
  
  const barsHTML = months.map((m,i)=>`
    <div class="bar-col">
      <div class="bar-val-t${i===3?' curr':''}">${monthSales[i]>=1000?Math.round(monthSales[i]/1000)+'k':monthSales[i]}</div>
      <div class="bar${i===3?' curr':''}" style="height:${Math.round(monthSales[i]/maxSale*80)}px;"></div>
      <div class="bar-lbl">${m}</div>
    </div>`).join('');
  
  const sourceMap = {};
  orders.forEach(o=>{ sourceMap[o.source]=(sourceMap[o.source]||0)+1; });
  const total=orders.length||1;
  const srcColors=['#d4a843','#3d7ac8','#2d8a5a','#c8553d'];
  const srcList=SOURCE_LIST.map((s,i)=>({ name:s, pct:Math.round((sourceMap[s]||0)/total*100), color:srcColors[i] }));
  
  const sourceHTML=srcList.map(s=>`
    <div class="source-item">
      <div class="source-dot" style="background:${s.color};"></div>
      <div class="source-name">${s.name}</div>
      <div class="source-pct">${s.pct}%</div>
    </div>`).join('');
  
  const rankMap={};
  orders.forEach(o=>o.items.forEach(it=>{ const p=getProductById(it.productId); if(p){ rankMap[p.category]=(rankMap[p.category]||0)+p.price*it.qty; } }));
  const ranking=Object.entries(rankMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const rankHTML=ranking.map((r,i)=>`<div class="rank-item"><div class="rank-num${i===0?' r1':''}">${i+1}</div><div class="rank-name">${r[0]}</div><div class="rank-sales">$${r[1].toLocaleString()}</div></div>`).join('');
  
  const staffMap={};
  orders.forEach(o=>{ staffMap[o.staff]=(staffMap[o.staff]||0)+o.items.reduce((s,it)=>{ const p=getProductById(it.productId); return s+(p?p.price*it.qty:0); },0); });
  const staffRank=Object.entries(staffMap).sort((a,b)=>b[1]-a[1]);
  const staffHTML=staffRank.map((r,i)=>`<div class="rank-item"><div class="rank-num${i===0?' r1':''}">${i+1}</div><div class="rank-name">${r[0]}</div><div class="rank-sales">$${r[1].toLocaleString()}</div></div>`).join('');

  return `
    <div class="chart-wrap">
      <div class="sec" style="margin:0 0 14px;">月銷售趨勢</div>
      <div class="bars">${barsHTML}</div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 12px;">客戶來源分析</div>
      <div class="source-legend">${sourceHTML}</div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:12px 0 8px;">商品銷售排行</div>
      ${rankHTML||'<div style="font-size:13px;color:var(--text3);padding:8px 0;">暫無資料</div>'}
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:12px 0 8px;">接單人員業績</div>
      ${staffHTML||'<div style="font-size:13px;color:var(--text3);padding:8px 0;">暫無資料</div>'}
    </div>
    <div style="height:20px;"></div>`;
}

window.togglePermission=async function(key){
  if(!PERMISSIONS.staff) PERMISSIONS.staff={...DEFAULT_PERMISSIONS.staff};
  PERMISSIONS.staff[key] = !(PERMISSIONS.staff[key]!==false);
  save('permissions', PERMISSIONS);
  await pushPermissionsToCloud();
  await logActivity('修改權限設定', `${PERMISSION_LABELS[key]||key} → ${PERMISSIONS.staff[key]?'開放':'關閉'}`);
  toast('✅ 權限已更新'+(CLOUD_ENABLED?'（已同步所有裝置）':''));
  renderPage('settings');
}

// ---- 帳號管理 ----
async function callAdminApi(action, payload){
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch('/api/admin', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ action, payload, accessToken: session?.access_token })
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error||'操作失敗');
  return json;
}

async function loadAccountsList(){
  const el = document.getElementById('accounts-list'); if(!el) return;
  try{
    const { data, error } = await sb.from('profiles').select('*').eq('tenant_id', TENANT_ID).order('created_at');
    if(error) throw error;
    el.innerHTML = data.map(a=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(26,10,46,0.06);">
        <div>
          <div style="font-size:14px;">${a.name} ${a.id===currentUser?.id?'<span style="color:var(--text3);font-size:11px;">（你）</span>':''}</div>
          <div style="font-size:11px;color:var(--text3);">${a.email||''} · ${a.role==='admin'?'管理員':'客服/門市人員'}${a.active?'':' · 已停用'}</div>
        </div>
        ${a.id===currentUser?.id?'':`<button class="btn btn-secondary btn-sm" style="margin:0;" onclick="openAccountEditModal('${a.id}')">管理</button>`}
      </div>`).join('') || '<div style="text-align:center;color:var(--text3);font-size:12px;padding:12px;">尚無帳號</div>';
  }catch(e){ console.error(e); el.innerHTML = '<div style="color:#c0392b;font-size:12px;">載入失敗</div>'; }
}

window.openCreateAccountModal=function(){
  openModal(`
    <div class="modal-title">新增帳號</div>
    <input class="form-input" type="text" id="na-name" placeholder="姓名" style="margin-bottom:10px;">
    <input class="form-input" type="email" id="na-email" placeholder="Email（登入帳號）" style="margin-bottom:10px;">
    <input class="form-input" type="password" id="na-pw" placeholder="初始密碼（至少6碼）" style="margin-bottom:10px;">
    <div class="switch" style="margin-bottom:16px;">
      <button class="switch-opt on" id="na-role-staff" onclick="setNewAccountRole('staff')">客服/門市人員</button>
      <button class="switch-opt" id="na-role-admin" onclick="setNewAccountRole('admin')">管理員</button>
    </div>
    <button class="btn btn-gold" id="na-submit" onclick="createAccount()">建立帳號</button>
  `);
  window._newAccountRole = 'staff';
}
window.setNewAccountRole=function(role){
  window._newAccountRole = role;
  document.getElementById('na-role-staff')?.classList.toggle('on', role==='staff');
  document.getElementById('na-role-admin')?.classList.toggle('on', role==='admin');
}
window.createAccount=async function(){
  const name=document.getElementById('na-name')?.value?.trim();
  const email=document.getElementById('na-email')?.value?.trim();
  const password=document.getElementById('na-pw')?.value;
  if(!name||!email||!password){ toast('⚠ 請填寫完整資料'); return; }
  const btn=document.getElementById('na-submit'); if(btn){ btn.disabled=true; btn.textContent='建立中...'; }
  try{
    await callAdminApi('create_user', { name, email, password, role: window._newAccountRole||'staff' });
    toast('✅ 帳號已建立');
    _closeModal();
    loadAccountsList();
  }catch(e){ toast('⚠ '+e.message); if(btn){ btn.disabled=false; btn.textContent='建立帳號'; } }
}

window.openAccountEditModal=async function(userId){
  const { data:a } = await sb.from('profiles').select('*').eq('id', userId).single();
  if(!a) return;
  openModal(`
    <div class="modal-title">管理帳號</div>
    <div style="font-size:14px;margin-bottom:2px;">${a.name}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:16px;">${a.email||''}</div>
    <div class="sec" style="margin:0 0 8px;">身份</div>
    <div class="switch" style="margin-bottom:16px;">
      <button class="switch-opt${a.role==='staff'?' on':''}" onclick="updateAccount('${userId}',{role:'staff'})">客服/門市人員</button>
      <button class="switch-opt${a.role==='admin'?' on':''}" onclick="updateAccount('${userId}',{role:'admin'})">管理員</button>
    </div>
    <div class="sec" style="margin:0 0 8px;">帳號狀態</div>
    <button class="btn ${a.active?'btn-secondary':'btn-gold'}" style="width:100%;margin-bottom:10px;" onclick="updateAccount('${userId}',{active:${!a.active}})">${a.active?'停用這個帳號':'重新啟用這個帳號'}</button>
    <div class="sec" style="margin:0 0 8px;">重設密碼</div>
    <input class="form-input" type="password" id="rp-pw" placeholder="新密碼（至少6碼）" style="margin-bottom:10px;">
    <button class="btn btn-secondary" style="width:100%;" onclick="resetAccountPassword('${userId}')">重設密碼</button>
  `);
}
window.updateAccount=async function(userId, changes){
  try{ await callAdminApi('update_account', { userId, ...changes }); toast('✅ 已更新'); _closeModal(); loadAccountsList(); }
  catch(e){ toast('⚠ '+e.message); }
}
window.resetAccountPassword=async function(userId){
  const newPassword=document.getElementById('rp-pw')?.value;
  if(!newPassword||newPassword.length<6){ toast('⚠ 密碼至少需要6碼'); return; }
  try{ await callAdminApi('reset_password', { userId, newPassword }); toast('✅ 密碼已重設'); _closeModal(); }
  catch(e){ toast('⚠ '+e.message); }
}

async function boot(){
  initDB();
  const now = new Date();
  document.getElementById('topbar-date').textContent = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;

  if(!CLOUD_ENABLED){
    // 沒接雲端資料庫時（本機測試模式），略過登入，直接給完整權限方便開發測試
    currentRole = 'admin';
    applyRolePermissions();
    renderPage('home');
    return;
  }

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    renderLoginForm();
    document.getElementById('role-picker').style.display='flex';
    return;
  }
  const ok = await loadCurrentProfile(session.user);
  if(!ok){
    document.getElementById('role-picker').style.display='flex';
    return;
  }
  applyRolePermissions();
  await syncAllFromCloud();
  renderPage('home');
}
boot();
</script>
