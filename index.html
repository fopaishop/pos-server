// ---- 商品照片（最多3張），新增/編輯商品共用：自動壓縮後上傳到 Supabase Storage ----
let _photoSlots = [];
let _photoSlotTarget = 0;
function photoSlotsHTML(){
  let html = '<div style="display:flex;gap:10px;flex-wrap:wrap;">';
  for(let i=0;i<3;i++){
    if(_photoSlots[i] === '__uploading__'){
      html += `<div><div class="photo-uploading">上傳中…</div><div style="font-size:10px;color:var(--text3);text-align:center;margin-top:2px;">${photoLabel(i)}</div></div>`;
    } else if(_photoSlots[i]){
      html += `<div style="position:relative;">
        <img src="${escA(_photoSlots[i])}" class="photo-preview">
        <button onclick="removePhotoSlot(${i})" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#c0392b;color:#fff;border:none;font-size:12px;cursor:pointer;">✕</button>
        <div style="font-size:10px;color:var(--text3);text-align:center;margin-top:2px;">${photoLabel(i)}</div>
      </div>`;
    } else {
      html += `<div><label class="photo-upload" onclick="triggerPhotoUpload(${i})">📷</label><div style="font-size:10px;color:var(--text3);text-align:center;margin-top:2px;">${photoLabel(i)}</div></div>`;
    }
  }
  html += '</div><input type="file" id="photo-slot-input" accept="image/*" style="display:none;" onchange="onPhotoSlotFile(this)">';
  return html;
}
window.triggerPhotoUpload=function(i){ _photoSlotTarget=i; document.getElementById('photo-slot-input').click(); }
function compressImage(file, maxSide, quality){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, maxSide/Math.max(w,h)); w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error('壓縮失敗')), 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('讀取圖片失敗')); };
    img.src = url;
  });
}
function blobToDataURL(b){ return new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.readAsDataURL(b); }); }
async function uploadProductPhoto(file){
  const blob = await compressImage(file, 1000, 0.82);
  if(CLOUD_ENABLED){
    try{
      const path = `${TENANT_ID}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error } = await sb.storage.from('product-images').upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000' });
      if(error) throw error;
      return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
    }catch(e){ console.warn('照片上傳 Storage 失敗，改存壓縮後的內嵌圖片', e); }
  }
  return await blobToDataURL(blob);
}
window.onPhotoSlotFile=async function(input){
  const f = input.files && input.files[0]; if(!f) return;
  const slot = _photoSlotTarget; input.value = '';
  _photoSlots[slot] = '__uploading__'; refreshPhotoSlotsUI();
  try{ _photoSlots[slot] = await uploadProductPhoto(f); }
  catch(e){ console.error(e); toast('⚠ 照片處理失敗，請換一張再試'); _photoSlots[slot] = ''; }
  refreshPhotoSlotsUI();
}
window.removePhotoSlot=function(i){ _photoSlots.splice(i,1); refreshPhotoSlotsUI(); }
function refreshPhotoSlotsUI(){
  const el = document.getElementById('photo-slots-container');
  if(el) el.innerHTML = photoSlotsHTML();
}

window.saveEditProduct=async function(id){
  const products = getProducts();
  const i = products.findIndex(p=>p.id===id);
  if(i<0) return;
  const name=document.getElementById('ep-name')?.value?.trim();
  const price=parseInt(document.getElementById('ep-price')?.value);
  const cat=document.getElementById('ep-cat')?.value;
  if(!name){ toast('⚠ 請填入商品名稱'); return; }
  if(!price||isNaN(price)){ toast('⚠ 請填入售價'); return; }

  const type=document.getElementById('ep-pos')?.classList.contains('on')?'正牌':'陰牌';
  const master=document.getElementById('ep-master')?.value||'';
  const year=document.getElementById('ep-year')?.value||'';
  const stock=parseInt(document.getElementById('ep-stock')?.value)||0;
  const material=document.getElementById('ep-material')?.value||'';
  const feature=document.getElementById('ep-feature')?.value||'';
  const effects=[...document.querySelectorAll('#ep-effects .chip.on')].map(c=>c.textContent);
  if(_photoSlots.includes('__uploading__')){ toast('⏳ 照片上傳中，請稍候再儲存'); return; }

  const updated = { ...products[i], name, price, category:cat, type, master, year, stock, material, feature, effects, image, images };
  products[i] = updated;
  save('products', products);
  await pushProductToCloud(updated);
  await logActivity('編輯商品', `${updated.name}（${updated.code}）`);

  _closeModal(); toast('✅ 商品已更新'+(CLOUD_ENABLED?'（已同步雲端）':'')); renderPage('products');
}

window.saveNewProduct=async function(){
  const name=document.getElementById('np-name')?.value?.trim();
  const price=parseInt(document.getElementById('np-price')?.value);
  const cat=document.getElementById('np-cat')?.value;
  if(!name){ toast('⚠ 請填入商品名稱'); return; }
  if(!price||isNaN(price)){ toast('⚠ 請填入售價'); return; }
  if(!cat||cat==='__new__'){ toast('⚠ 請選擇種類'); return; }
  
  const type=document.getElementById('np-pos')?.classList.contains('on')?'正牌':'陰牌';
  const master=document.getElementById('np-master')?.value||'';
  const year=document.getElementById('np-year')?.value||new Date().getFullYear().toString();
  const stock=parseInt(document.getElementById('np-stock')?.value)||1;
  const material=document.getElementById('np-material')?.value||'';
  const feature=document.getElementById('np-feature')?.value||'';
  const effects=[...document.querySelectorAll('#np-effects .chip.on')].map(c=>c.textContent);
  if(_photoSlots.includes('__uploading__')){ toast('⏳ 照片上傳中，請稍候再儲存'); return; }
  const images=_photoSlots.filter(Boolean);
  const image=images[0]||'';
  
  const catCode=cat.substring(0,2).toUpperCase();
  const products=getProducts();
  const code=((document.getElementById('np-code')?.value||'').trim().toUpperCase()) || nextProductCode(cat);

  const newProduct = { id:catCode+Date.now(), code, category:cat, name, type, master, year, stock, price, effects, material, feature, image, images };
  products.unshift(newProduct);
  save('products',products);
  await pushProductToCloud(newProduct);

let _bulkImportRows = null;
window.processBulkImportFile=async function(){
  const fileInput = document.getElementById('bulk-import-file');
  const file = fileInput?.files?.[0];
  if(!file){ toast('⚠ 請先選擇檔案'); return; }
  const btn = document.getElementById('bulk-import-btn');

  if(!_bulkImportRows){
    // 第一步：讀檔、解析、顯示預覽，等使用者確認
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      const parsed = rows.map(r=>{
        const code = String(r['編號']||'').trim();
        const effectsRaw = String(r['功效(用、分隔)']||r['功效']||'').trim();
        return {
          id: 'fp_'+code,
          code,
          category: String(r['分類']||'其他').trim(),
          name: String(r['商品名稱']||code).trim(),
          type: String(r['類型']||'正牌').trim()==='陰牌'?'陰牌':'正牌',
          master: String(r['師傅']||'').trim(),
          year: String(r['年份']||'').trim(),
          stock: parseInt(r['庫存'])||0,
          price: parseInt(r['價格'])||0,
          effects: effectsRaw ? effectsRaw.split(/[、,，]/).map(s=>s.trim()).filter(Boolean) : [],
          material: String(r['材料']||'').trim(),
          feature: String(r['特色']||'').trim(),
          image: String(r['圖片網址']||'').trim(),
          images: String(r['圖片網址']||'').trim() ? [String(r['圖片網址']).trim()] : [],
        };
      }).filter(r=>r.code);

      if(!parsed.length){ document.getElementById('bulk-import-preview').innerHTML = '<span style="color:#c0392b;">⚠ 沒有讀到有效資料，請確認欄位是否符合範本格式</span>'; return; }

      _bulkImportRows = parsed;
      document.getElementById('bulk-import-preview').innerHTML = `✅ 讀取到 <b>${parsed.length}</b> 筆商品，前3筆預覽：<br>` +
        parsed.slice(0,3).map(p=>`・${p.code} ${p.name}（$${p.price}）`).join('<br>');
      btn.textContent = `確認匯入 ${parsed.length} 筆商品`;
    }catch(e){
      console.error(e);
      document.getElementById('bulk-import-preview').innerHTML = '<span style="color:#c0392b;">⚠ 檔案解析失敗，請確認檔案格式</span>';
    }
    return;
  }

  // 第二步：使用者已確認，真正寫入
  btn.disabled = true; btn.textContent = '匯入中，請稍候...';
  try{
    const products = getProducts();
    for(const row of _bulkImportRows){
      const i = products.findIndex(p=>p.id===row.id);
      if(i>=0) products[i] = {...products[i], ...row};
      else products.unshift(row);
    }
    save('products', products);
    if(CLOUD_ENABLED){
      const CHUNK = 50;
      for(let i=0;i<_bulkImportRows.length;i+=CHUNK){
        const chunk = _bulkImportRows.slice(i,i+CHUNK).map(productToRow);
        const { error } = await sb.from('products').upsert(chunk);
        if(error) throw error;
      }
    }
    await logActivity('批量匯入商品', `匯入 ${_bulkImportRows.length} 筆`);
    toast(`✅ 已匯入 ${_bulkImportRows.length} 筆商品`+(CLOUD_ENABLED?'（已同步雲端）':''));
    _bulkImportRows = null;
    _closeModal();
    renderPage('products');
  }catch(e){
    console.error(e);
    toast('⚠ 匯入過程發生錯誤，部分資料可能未寫入，請重新整理確認');
    btn.disabled = false; btn.textContent = '重試匯入';
  }
}

let customerSearch = '';
// 客戶跟訂單的配對：優先用電話（唯一可靠），沒有電話時退而用姓名比對，
// 避免大量沒有電話的歷史客戶全部互相配對到彼此的訂單。
// ===== v1.5.0 客戶資料：暱稱／真實姓名／手機／多種收件方式 =====
const SHIP_ICON = { '711':'🏪', '全家':'🏪', '黑貓':'🚚', '門市自取':'🙋', '':'📍' };
function shipLabel(t){ return t==='黑貓' ? '宅配' : (t||'未分類'); }
function shipDetailLabel(t){ return (t==='711'||t==='全家') ? '門市' : '地址'; }
function _nk(x){ return String(x||'').trim().toLowerCase(); }
function customerMethods(c){
  const ms = Array.isArray(c.methods) ? c.methods.filter(m=>m && (m.type||m.detail)) : [];
  if(ms.length) return ms;
  return (c.shipping||c.shippingDetail) ? [{type:c.shipping||'', detail:c.shippingDetail||'', recipient:'', phone:'', count:1, last:''}] : [];
}
function isPrefMethod(c, m, i){ return (m.type||'')===(c.shipping||'') && (m.detail||'')===(c.shippingDetail||'') && (customerMethods(c).findIndex(x=>(x.type||'')===(c.shipping||'') && (x.detail||'')===(c.shippingDetail||''))===i); }
function methodLine(m){ return `${SHIP_ICON[m.type]||'📍'} ${shipLabel(m.type)}${m.type==='門市自取'?'':(m.detail?'｜'+escH(m.detail):'')}`; }
function customerMatches(c, v){
  v=_nk(v); if(!v) return true;
  return [c.name,c.realName,c.lineName,c.phone,c.email].some(x=>_nk(x).includes(v)) || customerMethods(c).some(m=>_nk(m.detail).includes(v)||_nk(m.recipient).includes(v));
}
function customerOrders(c, orders){
  const names=new Set([_nk(c.name)]); if(c.realName) names.add(_nk(c.realName));
  return orders.filter(o=> (c.phone && o.phone===c.phone) || names.has(_nk(o.customer)));
}

let customerSelectMode = false;
let customerSelectedIds = new Set();
function customerCardsHTML(customers, orders){
  return customers.map(c=>{
    const cOrders = customerOrders(c, orders);
    const total = cOrders.reduce((sum,o)=>sum+(o.subtotal!=null?o.subtotal:o.items.reduce((s,it)=>s+itemLineTotal(it),0)),0);
    const last = [...cOrders].sort((a,b)=>b.date.localeCompare(a.date))[0];
    const initials = c.name.slice(-2);
    const checked = customerSelectedIds.has(c.id);
    const ms = customerMethods(c);
    const mHTML = ms.slice(0,3).map((m,i)=>`<div style="font-size:12px;color:var(--text2);line-height:1.5;word-break:break-all;">${methodLine(m)}${isPrefMethod(c,m,i)&&ms.length>1?' <span style="color:var(--gold);font-size:11px;">★常用</span>':''}</div>`).join('')
      + (ms.length>3?`<div style="font-size:11px;color:var(--text3);">…還有 ${ms.length-3} 種收件方式</div>`:'')
      || '<div style="font-size:12px;color:var(--text3);">尚未留收件資料</div>';
    return `<div class="customer-card" style="display:flex;gap:10px;align-items:flex-start;${checked?'outline:2px solid var(--gold);':''}" onclick="${customerSelectMode?`toggleCustomerSelect('${c.id}')`:`openCustomerDetail('${c.id}')`}">
      ${customerSelectMode?`<input type="checkbox" ${checked?'checked':''} style="width:20px;height:20px;margin-top:2px;flex-shrink:0;pointer-events:none;">`:''}
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;">
          <div class="customer-avatar">${escH(initials)}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:500;">${escH(c.name)}${c.realName&&c.realName!==c.name?` <span style="font-size:12px;color:var(--text2);font-weight:400;">${escH(c.realName)}</span>`:''}</div>
            <div style="font-size:12px;color:var(--text2);margin-bottom:3px;">📱 ${escH(c.phone)||'未留手機'}${c.lineName?` · LINE：${escH(c.lineName)}`:''}</div>
            ${mHTML}
          </div>
        </div>
        <div style="display:flex;gap:0;">
          <div class="customer-stat" style="flex:1;border-right:1px solid rgba(26,10,46,0.08);">
            <div class="customer-stat-val">${cOrders.length}</div>
            <div class="customer-stat-label">訂單數</div>
          </div>
          <div class="customer-stat" style="flex:1;border-right:1px solid rgba(26,10,46,0.08);">
            <div class="customer-stat-val">$${total>999?Math.round(total/1000)+'k':total}</div>
            <div class="customer-stat-label">消費總額</div>
          </div>
          <div class="customer-stat" style="flex:1;">
            <div class="customer-stat-val" style="font-size:13px;">${last?last.date.slice(5):'—'}</div>
            <div class="customer-stat-label">最近購買</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('') || '<div class="empty-state"><div class="emoji">👤</div><p>無客戶資料</p></div>';
}

    <button class="btn btn-gold" style="margin-top:14px;" onclick="saveBatchMerge()">確認合併</button>

window.saveBatchMerge=async function(){
  const name=document.getElementById('bm-name')?.value?.trim();
  if(!name){ toast('⚠ 請填寫姓名'); return; }
  const ids=[...customerSelectedIds];
  const group=getCustomers().filter(c=>ids.includes(c.id));
  const best=[...group].sort((a,b)=>{ const score=c=>(c.phone?2:0)+(c.shippingDetail?1:0); return score(b)-score(a); })[0];
  const keep={ ...best,
    name,
    phone:document.getElementById('bm-phone')?.value?.trim()||'',
    shipping:document.getElementById('bm-shipping')?.value||'',
    shippingDetail:document.getElementById('bm-detail')?.value||'' };
  const others=group.filter(c=>c.id!==keep.id);
  const remaining=getCustomers().filter(c=>!others.some(o=>o.id===c.id));
  const idx=remaining.findIndex(c=>c.id===keep.id);
  remaining[idx]=keep;
  save('customers',remaining);
  await pushCustomerToCloud(keep);
  if(CLOUD_ENABLED){
    for(const o of others){ try{ await sb.from('customers').delete().eq('id',o.id); }catch(e){ console.error(e); } }
  }
  await logActivity('批次合併客戶', `${group.length}筆合併為「${name}」`);
  customerSelectMode=false; customerSelectedIds=new Set();
  _closeModal();
  toast(`✅ 已合併為「${name}」`);
  renderPage('customers');
}

window.saveEditCustomer=async function(id){
  const customers=getCustomers();
  const i=customers.findIndex(c=>c.id===id);
  if(i<0) return;
  const name=document.getElementById('ec-name')?.value?.trim();
  if(!name){ toast('⚠ 請填寫社群暱稱'); return; }

  let pref=Math.min(window._ecPref||0, Math.max(0,ms.length-1));
  const prefOld=_ecMethods.filter(m=>m.type||m.detail)[pref];

}

window.mergeCustomerGroup=async function(name){
  const checkedIds = [...document.querySelectorAll('.merge-check:checked')].map(el=>el.value);
  if(checkedIds.length<2){ toast('⚠ 至少要勾選2筆才能合併'); return; }
  const customers=getCustomers();
  const group=customers.filter(c=>checkedIds.includes(c.id));
  // 選出資料最完整的一筆當作保留對象：優先有電話的，再優先有寄送地址的
  const keep = [...group].sort((a,b)=>{
    const score=(c)=> (c.phone?2:0) + (c.shippingDetail?1:0) + (c.realName?1:0);
    return score(b)-score(a);
  })[0];
  const others = group.filter(c=>c.id!==keep.id);
  // 合併所有收件方式（相同類型＋門市／地址只留一筆，次數相加）
  const mergedMs = customerMethods(keep).map(m=>({...m}));
  others.forEach(o=>{
    customerMethods(o).forEach(m=>{
      const ex = mergedMs.find(x=>(x.type||'')===(m.type||'') && (x.detail||'')===(m.detail||''));
      if(ex){ ex.count=(ex.count||0)+(m.count||0); if((m.last||'')>(ex.last||'')) ex.last=m.last; }
      else mergedMs.push({...m});
    });
    if(!keep.realName && o.realName) keep.realName=o.realName;
    if(!keep.lineName && o.lineName) keep.lineName=o.lineName;
    if(!keep.email && o.email) keep.email=o.email;
  });
  keep.methods = mergedMs;
  if(!keep.phone){ const withPhone=others.find(c=>c.phone); if(withPhone) keep.phone=withPhone.phone; }

  const remaining = customers.filter(c=>!others.some(o=>o.id===c.id));
  const idx = remaining.findIndex(c=>c.id===keep.id);
  remaining[idx]=keep;
  save('customers', remaining);
  await pushCustomerToCloud(keep);
  if(CLOUD_ENABLED){
    for(const o of others){
      try{ await sb.from('customers').delete().eq('id', o.id); }
      catch(e){ console.error('刪除合併對象失敗', e); }
    }
  }
  await logActivity('合併同名客戶', `${name}（${group.length}筆合併為1筆）`);
  toast(`✅ 已合併「${name}」的 ${group.length} 筆資料`);
  openMergeDuplicateCustomers();
}

// ============ REPORT ============
let reportMonth = new Date().toISOString().slice(0,7);
let reportCompareMonth = '';

const REPORT_FIRST_MONTH = '2026-02'; // 報表最早可選的月份，之後有更早的資料可以再往前調整
function getAvailableMonths(orders){
  const set = new Set(orders.map(o=>o.date&&o.date.slice(0,7)).filter(Boolean));
  // 從最早月份連續產生到「現在」這個月，這樣即使該月還沒有任何訂單，也能先選來看/比較，
  // 而且因為是即時用今天的日期算出來的，每次開頁面都會自動包含到最新月份，不用手動新增。
  const [fy,fm] = REPORT_FIRST_MONTH.split('-').map(Number);
  const now = new Date();
  let y=fy, m=fm;
  while(y<now.getFullYear() || (y===now.getFullYear() && m<=now.getMonth()+1)){
    set.add(`${y}-${String(m).padStart(2,'0')}`);
    m++; if(m>12){ m=1; y++; }
  }
  return [...set].sort().reverse();
}
function monthLabel(ym){ if(!ym) return ''; const [y,m]=ym.split('-'); return `${y}年${parseInt(m)}月`; }
function computeMonthStats(orders, ym){
  const filtered = orders.filter(o=>o.date && o.date.startsWith(ym));
  let subtotal=0, total=0;
  filtered.forEach(o=>{
    const s = o.subtotal!=null ? o.subtotal : o.items.reduce((x,it)=>x+itemLineTotal(it),0);
    const t = o.total!=null && o.total>0 ? o.total : s + (o.shippingFee||0);
    subtotal += s; total += t;
  });
  return { orders:filtered, subtotal, total, orderCount:filtered.length };
}

function renderReport(){
  const orders = getOrders();
  const months = getAvailableMonths(orders);
  if(!months.includes(reportMonth)) reportMonth = months[0];

  const cur = computeMonthStats(orders, reportMonth);
  const compare = reportCompareMonth ? computeMonthStats(orders, reportCompareMonth) : null;

  const monthOpts = months.map(m=>`<option value="${m}"${m===reportMonth?' selected':''}>${monthLabel(m)}</option>`).join('');
  const compareOpts = `<option value="">不比較</option>` + months.filter(m=>m!==reportMonth).map(m=>`<option value="${m}"${m===reportCompareMonth?' selected':''}>${monthLabel(m)}</option>`).join('');

  const diffPct = (a,b)=> b===0 ? (a>0?'+100%':'0%') : (((a-b)/b*100)>=0?'+':'')+Math.round((a-b)/b*100)+'%';

  const compareHTML = compare ? `
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 12px;">月份比較：${monthLabel(reportMonth)} vs ${monthLabel(reportCompareMonth)}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(26,10,46,0.06);">
        <span style="color:var(--text2);">實際銷售額</span>
        <span>$${cur.subtotal.toLocaleString()} <span style="color:var(--text3);">vs</span> $${compare.subtotal.toLocaleString()} <b style="color:${cur.subtotal>=compare.subtotal?'#2d7a4a':'#c0392b'};">${diffPct(cur.subtotal,compare.subtotal)}</b></span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(26,10,46,0.06);">
        <span style="color:var(--text2);">含運費銷售額</span>
        <span>$${cur.total.toLocaleString()} <span style="color:var(--text3);">vs</span> $${compare.total.toLocaleString()} <b style="color:${cur.total>=compare.total?'#2d7a4a':'#c0392b'};">${diffPct(cur.total,compare.total)}</b></span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;">
        <span style="color:var(--text2);">訂單數</span>
        <span>${cur.orderCount} <span style="color:var(--text3);">vs</span> ${compare.orderCount} <b style="color:${cur.orderCount>=compare.orderCount?'#2d7a4a':'#c0392b'};">${diffPct(cur.orderCount,compare.orderCount)}</b></span>
      </div>
    </div>` : '';

  const sourceMap = {};
  cur.orders.forEach(o=>{ sourceMap[o.source]=(sourceMap[o.source]||0)+1; });
  const totalOrders=cur.orders.length||1;
  const srcColors=['#d4a843','#3d7ac8','#2d8a5a','#c8553d'];
  const srcList=SOURCE_LIST.map((s,i)=>({ name:s, pct:Math.round((sourceMap[s]||0)/totalOrders*100), color:srcColors[i] }));
  const sourceHTML=srcList.map(s=>`
    <div class="source-item">
      <div class="source-dot" style="background:${s.color};"></div>
      <div class="source-name">${s.name}</div>
      <div class="source-pct">${s.pct}%</div>
    </div>`).join('');

  const rankMap={};
  cur.orders.forEach(o=>o.items.forEach(it=>{ rankMap[itemName(it)]=(rankMap[itemName(it)]||0)+itemLineTotal(it); }));
  const ranking=Object.entries(rankMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const rankHTML=ranking.map((r,i)=>`<div class="rank-item"><div class="rank-num${i===0?' r1':''}">${i+1}</div><div class="rank-name">${r[0]}</div><div class="rank-sales">$${r[1].toLocaleString()}</div></div>`).join('');

  const staffMap={};
  cur.orders.forEach(o=>{ staffMap[o.staff]=(staffMap[o.staff]||0)+(o.subtotal!=null?o.subtotal:o.items.reduce((s,it)=>s+itemLineTotal(it),0)); });
  const staffRank=Object.entries(staffMap).sort((a,b)=>b[1]-a[1]);
  const staffHTML=staffRank.map((r,i)=>`<div class="rank-item"><div class="rank-num${i===0?' r1':''}">${i+1}</div><div class="rank-name">${r[0]}</div><div class="rank-sales">$${r[1].toLocaleString()}</div></div>`).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <select class="form-select" id="rp-month" style="flex:1;" onchange="setReportMonth(this.value)">${monthOpts}</select>

    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <div class="stat-card" style="flex:1;">
        <div class="stat-label">實際銷售額</div>
        <div class="stat-val" style="font-size:20px;">$${cur.subtotal.toLocaleString()}</div>
        <div class="stat-tag" style="background:rgba(45,122,74,0.1);color:#2d7a4a;">不含運費</div>
      </div>
      <div class="stat-card" style="flex:1;">
        <div class="stat-label">含運費銷售額</div>
        <div class="stat-val" style="font-size:20px;">$${cur.total.toLocaleString()}</div>
        <div class="stat-tag" style="background:rgba(61,122,200,0.1);color:#3d7ac8;">${cur.orderCount} 筆訂單</div>
      </div>
    </div>
    ${compareHTML}
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 12px;">客戶來源分析（${monthLabel(reportMonth)}）</div>

// ---- 帳號管理 ----
async function callAdminApi(action, payload){
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch('/api/admin', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ action, payload, accessToken: session?.access_token })
  });
  const text = await res.text();
  let json;
  try{ json = JSON.parse(text); }
  catch(e){
    throw new Error(`伺服器沒有回傳正確格式（可能是 api/admin.js 未部署成功，或 Vercel 環境變數未設定）。原始訊息：${text.slice(0,120)}`);
  }
  if(!res.ok) throw new Error(json.error||'操作失敗');
  return json;
}

window.createAccount=async function(){
  const name=document.getElementById('na-name')?.value?.trim();
  const email=document.getElementById('na-email')?.value?.trim();
  const password=document.getElementById('na-pw')?.value;
  if(!name||!email||!password){ toast('⚠ 請填寫完整資料'); return; }
  const btn=document.getElementById('na-submit'); if(btn){ btn.disabled=true; btn.textContent='建立中...'; }
  try{
    await callAdminApi('create_user', { name, email, password, role: window._newAccountRole||'staff' });

    _closeModal();
    loadAccountsList();
  }catch(e){ toast('⚠ '+e.message); if(btn){ btn.disabled=false; btn.textContent='建立帳號'; } }

// ---- 圖片遷移到 Supabase Storage ----
window.startImageMigration=async function(){
  const btn=document.getElementById('migrate-img-btn');
  const prog=document.getElementById('migrate-img-progress');
  btn.disabled=true; btn.textContent='遷移中...';
  let totalDone=0, totalFail=0;
  try{
    while(true){
      const result = await callAdminApi('migrate_images_batch', { batchSize: 5 });
      totalDone += result.results.filter(r=>r.ok).length;
      totalFail += result.results.filter(r=>!r.ok).length;
      prog.innerHTML = `已處理 ${totalDone} 筆${totalFail?`（${totalFail} 筆失敗）`:''}，剩餘約 ${result.remaining} 筆...`;
      if(result.processed===0 || result.remaining<=0) break;
    }
    prog.innerHTML += `<br>✅ 遷移完成！共成功 ${totalDone} 筆${totalFail?`，失敗 ${totalFail} 筆（可能是原始連結已失效，需要手動確認）`:''}。`;
    toast('✅ 圖片遷移完成');
    await syncProductsFromCloud();
  }catch(e){
    prog.innerHTML += `<br>⚠ 發生錯誤：${e.message}`;
    toast('⚠ 遷移中斷：'+e.message);
  }finally{
    btn.disabled=false; btn.textContent='開始遷移圖片';
  }
}

async function boot(){
  initDB();
  const now = new Date();
  document.getElementById('topbar-date').textContent = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;

  if(!CLOUD_ENABLED){
    // 沒接雲端資料庫時（本機測試模式），略過登入，直接給完整權限方便開發測試
    currentRole = 'admin';
    applyRolePermissions();
    renderPage('home');
    return;
  }

  // 點了「忘記密碼」信裡的連結回來，網址會帶著 type=recovery，直接顯示設定新密碼畫面
  if(window.location.hash.includes('type=recovery')){
    renderSetNewPasswordForm();
    return;
  }
  sb.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY') renderSetNewPasswordForm(); });

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    renderLoginForm();
    showRolePicker();
    return;
  }
  const ok = await loadCurrentProfile(session.user);
  if(!ok){
    showRolePicker();
    return;
  }
  applyRolePermissions();
  await syncAllFromCloud();
  renderPage('home');
}
boot();
