<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="佛牌殿">
<title>佛牌殿 POS系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
//  ★ 設定區：填入你的 Supabase 資訊後存檔重新上傳即可 ★
// ============================================================
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';   // ← 改這裡
const SUPABASE_KEY = 'YOUR_ANON_KEY';                       // ← 改這裡
// ============================================================
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 判斷是否已設定Supabase（未設定則使用localStorage離線模式）
const USE_CLOUD = SUPABASE_URL !== 'https://YOUR_PROJECT.supabase.co';

// ============ 雲端 / 離線 資料層 ============
const DB = {
  async getProducts() {
    if (!USE_CLOUD) return load('products') || [];
    const { data } = await _sb.from('products').select('*').order('created_at', { ascending: false });
    return (data || []).map(p => ({ ...p, effects: p.effects || [] }));
  },
  async getOrders() {
    if (!USE_CLOUD) return load('orders') || [];
    const { data } = await _sb.from('orders').select('*').order('created_at', { ascending: false });
    return (data || []).map(o => ({ ...o, items: o.items || [] }));
  },
  async getCustomers() {
    if (!USE_CLOUD) return load('customers') || [];
    const { data } = await _sb.from('customers').select('*').order('created_at', { ascending: false });
    return data || [];
  },
  async saveOrder(order) {
    if (!USE_CLOUD) {
      const orders = load('orders') || [];
      const i = orders.findIndex(o => o.id === order.id);
      if (i >= 0) orders[i] = order; else orders.unshift(order);
      save('orders', orders); return { data: order, error: null };
    }
    const dbOrder = { id: order.id, date: order.date, customer: order.customer, phone: order.phone, shipping: order.shipping, shipping_detail: order.shippingDetail || order.shipping_detail || '', items: order.items, gift: order.gift, staff: order.staff, source: order.source, status: order.status, note: order.note };
    const exist = await _sb.from('orders').select('id').eq('id', order.id).single();
    if (exist.data) return _sb.from('orders').update({ ...dbOrder, updated_at: new Date().toISOString() }).eq('id', order.id).select().single();
    return _sb.from('orders').insert(dbOrder).select().single();
  },
  async updateOrderStatus(id, status) {
    if (!USE_CLOUD) {
      const orders = load('orders') || [];
      const i = orders.findIndex(o => o.id === id);
      if (i >= 0) orders[i].status = status;
      save('orders', orders); return true;
    }
    const { error } = await _sb.from('orders').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
    return !error;
  },
  async saveProduct(product) {
    if (!USE_CLOUD) {
      const products = load('products') || [];
      products.unshift(product); save('products', products); return true;
    }
    const dbProd = { id: product.id, code: product.code, category: product.category, name: product.name, type: product.type, master: product.master, year: product.year, stock: product.stock, price: product.price, effects: product.effects, material: product.material, feature: product.feature, image_url: product.image || product.image_url || '' };
    const { error } = await _sb.from('products').insert(dbProd);
    return !error;
  },
  async updateStock(id, newStock) {
    if (!USE_CLOUD) {
      const products = load('products') || [];
      const i = products.findIndex(p => p.id === id);
      if (i >= 0) products[i].stock = newStock;
      save('products', products); return true;
    }
    const { error } = await _sb.from('products').update({ stock: newStock }).eq('id', id);
    return !error;
  },
  async saveCustomer(customer) {
    if (!USE_CLOUD) {
      const customers = load('customers') || [];
      const i = customers.findIndex(c => c.phone === customer.phone);
      if (i < 0) customers.push(customer);
      save('customers', customers); return true;
    }
    await _sb.from('customers').upsert({ id: customer.id, name: customer.name, phone: customer.phone, shipping: customer.shipping, shipping_detail: customer.shippingDetail || customer.shipping_detail || '' }, { onConflict: 'phone' });
    return true;
  },
  async uploadImage(file) {
    if (!USE_CLOUD) {
      return new Promise(resolve => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.readAsDataURL(file);
      });
    }
    const filename = `product-${Date.now()}.jpg`;
    const { error } = await _sb.storage.from('product-images').upload(filename, file, { contentType: file.type || 'image/jpeg' });
    if (error) return null;
    const { data } = _sb.storage.from('product-images').getPublicUrl(filename);
    return data.publicUrl;
  }
};
</script>
<style>

<script>
// ============ DATA ============

// 快取（減少重複請求）
let _cache = { products: null, orders: null, customers: null, ts: {} };
const CACHE_TTL = 30000; // 30秒快取
async function getProducts() {
  if (_cache.products && Date.now() - (_cache.ts.products||0) < CACHE_TTL) return _cache.products;
  _cache.products = await DB.getProducts();
  _cache.ts.products = Date.now();
  return _cache.products;
}
async function getOrders() {
  if (_cache.orders && Date.now() - (_cache.ts.orders||0) < CACHE_TTL) return _cache.orders;
  _cache.orders = await DB.getOrders();
  _cache.ts.orders = Date.now();
  return _cache.orders;
}
async function getCustomers() {
  if (_cache.customers && Date.now() - (_cache.ts.customers||0) < CACHE_TTL) return _cache.customers;
  _cache.customers = await DB.getCustomers();
  _cache.ts.customers = Date.now();
  return _cache.customers;
}
function clearCache(key) { if (key) { _cache[key] = null; } else { _cache = { products: null, orders: null, customers: null, ts: {} }; } }
function getStaff(){ return load('staff')||['店長','小美','阿傑']; }
function getProductById(id){ return (_cache.products||[]).find(p=>p.id===id)||null; }

function getProductName(id){ const p=getProductById(id); return p?p.name:id; }

function genOrderId(){
  const orders=getOrders();
  const n = orders.length ? parseInt(orders[0].id.replace('ORD',''))+1 : 2025001;
  return 'ORD'+String(n).padStart(7,'0');
}

// ============ UI HELPERS ============
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function openModal(html){ 
  document.getElementById('modal-content').innerHTML=html; 
  document.getElementById('modal').classList.add('open'); 
}
function closeModal(e){ 
  if(e && e.target!==document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open'); 
}
window._closeModal=function(){ document.getElementById('modal').classList.remove('open'); }

function chip(label, key, arr, onToggle){
  return `<span class="chip${arr.includes(label)?' on':''}" onclick="${onToggle}('${label.replace(/'/g,"\\'")}',this)">${label}</span>`;
}

function selectModal(title, options, onSelect, allowNew=false){
  const opts = options.map(o=>`<div class="order-card" style="padding:12px 14px;margin-bottom:6px;" onclick="_selectModalItem('${o.replace(/'/g,"\\'")}','${onSelect}')">${o}</div>`).join('');
  const newBtn = allowNew ? `<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="_addNewOption('${onSelect}')">+ 新增選項</button>` : '';
  openModal(`<div class="modal-title">${title}</div>${opts}${newBtn}`);
}
window._selectModalItem=function(val, fn){ window._closeModal(); if(window[fn]) window[fn](val); }
window._addNewOption=function(fn){ const v=prompt('輸入新選項：'); if(v&&v.trim()) { if(window[fn]) window[fn](v.trim()); } }

// ============ NAVIGATION ============
let currentPage = 'home';
document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  const page = btn.dataset.page;
  navigateTo(page);
});

function navigateTo(page){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+page));
  currentPage = page;
  document.getElementById('content').scrollTop = 0;
  renderPage(page);
}

async function renderPage(page){
  const el = document.getElementById('page-'+page);
  if(!el) return;
  el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text3);"><div style="font-size:28px;margin-bottom:10px;">⏳</div><div style="font-size:13px;">載入中...</div></div>`;
  const renderers = { home: renderHome, orders: renderOrders, 'new-order': renderNewOrder, filter: renderFilter, products: renderProducts, customers: renderCustomers, report: renderReport };
  if(renderers[page]) el.innerHTML = await renderers[page]();
  bindPageEvents(page);
}

async function renderHome(){
  const orders = await getOrders();
  const todayShip = orders.filter(o=>o.status==='待寄出'||o.status==='待選鍊子');
  const thisMonth = orders.filter(o=>o.date.startsWith('2025-01'));
  const totalSales = thisMonth.reduce((sum,o)=>{
    return sum + o.items.reduce((s,it)=>{ const p=getProductById(it.productId); return s+(p?p.price*it.qty:0); },0);
  }, 0);
  
  const rankMap = {};
  thisMonth.forEach(o=>o.items.forEach(it=>{ const p=getProductById(it.productId); if(p){ rankMap[p.category]=(rankMap[p.category]||0)+p.price*it.qty; } }));
  const ranking = Object.entries(rankMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  
  const rankHTML = ranking.map((r,i)=>`
    <div class="rank-item">
      <div class="rank-num${i===0?' r1':''}">${i+1}</div>
      <div class="rank-name">${r[0]}</div>
      <div class="rank-sales">$${r[1].toLocaleString()}</div>
    </div>`).join('');
  
  const shipCards = todayShip.slice(0,3).map(o=>{
    const items = o.items.map(it=>`${getProductName(it.productId)} ×${it.qty}`).join('、');
    const noGift = o.items.some(it=>{ const p=getProductById(it.productId); return p&&p.category!=='手鍊'&&p.category!=='符管'; }) && !o.gift;
    return `<div class="order-card" onclick="openOrderDetail('${o.id}')">
      <div class="order-head">
        <div><div class="order-name">${o.customer}</div><div class="order-id">#${o.id}</div></div>
        <span class="badge ${STATUS_BADGE[o.status]||'b-ship'}">${o.status}</span>
      </div>
      <div class="order-info">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail} · ${o.phone}</div>
      <div class="order-items-text">${items}</div>
      ${noGift?'<div class="alert-pill">⚠ 未填佛牌鍊，請確認</div>':''}
    </div>`;
  }).join('');

  return `
    <div class="stat-grid">
      <div class="stat-card accent">
        <div class="stat-label">本月銷售額</div>
        <div class="stat-val">$${totalSales.toLocaleString()}</div>
        <div class="stat-tag tag-up">↑ 持續成長中</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日待出貨</div>
        <div class="stat-val" style="color:#c0392b;">${todayShip.length} 筆</div>
        <div class="stat-tag tag-warn">需處理</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本月訂單數</div>
        <div class="stat-val">${thisMonth.length}</div>
        <div class="stat-tag tag-up">筆訂單</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">待選鍊子</div>
        <div class="stat-val" style="color:#a06010;">${orders.filter(o=>o.status==='待選鍊子').length} 筆</div>
        <div class="stat-tag tag-warn">待確認</div>
      </div>
    </div>
    <div class="sec">今日待出貨</div>
    ${shipCards || '<div class="empty-state"><div class="emoji">✅</div><p>今日無待出貨訂單</p></div>'}
    <div class="sec" style="margin-top:20px;">本月銷售排行</div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;border:1px solid rgba(26,10,46,0.06);">
      ${rankHTML || '<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px;">暫無資料</div>'}
    </div>`;
}

let orderFilter = '全部';
let orderSearch = '';
async function renderOrders(){
  const orders = await getOrders();
  let filtered = orders;
  if(orderFilter!=='全部') filtered = filtered.filter(o=>o.status===orderFilter);
  if(orderSearch) filtered = filtered.filter(o=>o.customer.includes(orderSearch)||o.id.includes(orderSearch)||o.phone.includes(orderSearch));
  
  const statusBtns = STATUS_LIST.map(s=>`<span class="chip${orderFilter===s?' on':''}" onclick="setOrderFilter('${s}')" style="white-space:nowrap;">${s}</span>`).join('');
  
  const cards = filtered.map(o=>{
    const items = o.items.map(it=>`${getProductName(it.productId)} ×${it.qty}`).join('、');
    const noGift = o.items.some(it=>{ const p=getProductById(it.productId); return p&&!['手鍊','符管','周邊聖物'].includes(p.category); }) && !o.gift;
    return `<div class="order-card" onclick="openOrderDetail('${o.id}')">
      <div class="order-head">
        <div><div class="order-name">${o.customer}</div><div class="order-id">#${o.id} · ${o.date}</div></div>
        <span class="badge ${STATUS_BADGE[o.status]||'b-ship'}">${o.status}</span>
      </div>
      <div class="order-info">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail}<br>接單：${o.staff} · 來源：${o.source}</div>
      <div class="order-items-text">${items}${o.gift?' ｜ 贈品：'+o.gift:''}</div>
      ${noGift?'<div class="alert-pill">⚠ 未填佛牌鍊，請確認</div>':''}
      ${o.note?`<div style="font-size:12px;color:var(--text3);margin-top:6px;">備註：${o.note}</div>`:''}
    </div>`;
  }).join('');

  return `
    <div class="search-bar"><span class="search-icon">🔍</span><input type="text" placeholder="搜尋訂單、客戶、電話..." id="order-search" value="${orderSearch}" oninput="setOrderSearch(this.value)"></div>
    <div class="chip-row" style="margin-bottom:14px;">${statusBtns}</div>
    ${cards || '<div class="empty-state"><div class="emoji">📋</div><p>無符合訂單</p></div>'}
    <div style="height:80px;"></div>`;
}

window.setOrderFilter=function(s){ orderFilter=s; renderPage('orders'); }
window.setOrderSearch=function(v){ orderSearch=v; renderPage('orders'); }

window.openOrderDetail=function(id){
  const o = getOrders().find(x=>x.id===id);
  if(!o) return;
  const items = o.items.map(it=>{ const p=getProductById(it.productId); return `${p?p.name:it.productId} ×${it.qty}${p?' ($'+p.price.toLocaleString()+')':''}`; }).join('<br>');
  const statusOpts = ['待寄出','待選鍊子','待自取','已寄出','取消','退貨'].map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('');
  openModal(`
    <div class="modal-title">訂單詳情 #${o.id}</div>
    <div class="detail-row"><span class="detail-key">訂購人</span><span class="detail-val">${o.customer}</span></div>
    <div class="detail-row"><span class="detail-key">電話</span><span class="detail-val">${o.phone}</span></div>
    <div class="detail-row"><span class="detail-key">寄送方式</span><span class="detail-val">${o.shipping==='門市自取'?'門市自取':o.shipping+' · '+o.shippingDetail}</span></div>
    <div class="detail-row"><span class="detail-key">訂購商品</span><span class="detail-val">${items}</span></div>
    <div class="detail-row"><span class="detail-key">贈品</span><span class="detail-val">${o.gift||'—'}</span></div>
    <div class="detail-row"><span class="detail-key">接單人員</span><span class="detail-val">${o.staff}</span></div>
    <div class="detail-row"><span class="detail-key">客戶來源</span><span class="detail-val">${o.source}</span></div>
    <div class="detail-row"><span class="detail-key">備註</span><span class="detail-val">${o.note||'—'}</span></div>
    <div style="margin-top:16px;">
      <div class="form-label">更新進度</div>
      <select class="form-select" id="status-sel">${statusOpts}</select>
    </div>
    <button class="btn btn-primary" onclick="updateOrderStatus('${id}')">更新訂單狀態</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="_closeModal()">關閉</button>
  `);
}

window.updateOrderStatus=async function(id){

window.onShipChange=function(val){
  newOrder.shipping=val;
  const block=document.getElementById('ship-detail-block');
  const lbl=document.getElementById('ship-detail-label');
  if(val==='門市自取'||!val){ block.style.display='none'; }
  else { block.style.display='block'; lbl.textContent=val==='711'?'711門市名稱':'宅配地址'; document.getElementById('no-ship-detail').placeholder=val==='711'?'例：全家信義店':'完整收件地址'; }
}

window.searchCustomer=function(v){
  const sugg=document.getElementById('customer-suggestions'); if(!sugg)return;
  if(!v){ sugg.innerHTML=''; return; }
  const matches=getCustomers().filter(c=>c.name.includes(v)||c.phone.includes(v));
  if(!matches.length){ sugg.innerHTML=''; return; }
  sugg.innerHTML=`<div style="background:var(--white);border-radius:8px;border:1px solid rgba(26,10,46,0.1);margin-top:4px;">` + matches.map(c=>`<div style="padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(26,10,46,0.06);" onclick="fillCustomer('${c.id}')">${c.name} · ${c.phone}</div>`).join('') + `</div>`;
}

window.fillCustomer=function(id){
  const c=getCustomers().find(x=>x.id===id); if(!c)return;
  document.getElementById('no-customer').value=c.name;
  document.getElementById('no-phone').value=c.phone;
  document.getElementById('no-shipping').value=c.shipping||'';
  onShipChange(c.shipping||'');
  if(document.getElementById('no-ship-detail')) document.getElementById('no-ship-detail').value=c.shippingDetail||'';
  document.getElementById('customer-suggestions').innerHTML='';
}

window.setOrderField=function(field,val,el){
  newOrder[field]=val;
  el.closest('.chip-row').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
}

window.openProductPicker=async function(){
  const products=await getProducts();
  const html=`<div class="modal-title">選擇商品</div>` + products.map(p=>`
    <div class="product-card" onclick="addProduct('${p.id}')">
      <div class="product-img" style="width:44px;height:44px;font-size:18px;">🏺</div>
      <div>
        <div class="product-name">${p.name}</div>
        <div class="product-meta">${p.code} · 庫存：${p.stock}</div>
        <div style="font-size:13px;font-weight:500;color:var(--deep);margin-top:3px;">$${p.price.toLocaleString()}</div>
      </div>
    </div>`).join('');
  openModal(html);
}

window.addProduct=function(id){
  const p=getProductById(id); if(!p)return;
  const exist=selectedProducts.findIndex(x=>x.id===id);
  if(exist>=0) selectedProducts[exist].qty++;
  else selectedProducts.push({...p,qty:1});
  _closeModal();
  renderPage('new-order');
}

window.changeQty=function(i,delta){
  selectedProducts[i].qty+=delta;
  if(selectedProducts[i].qty<=0) selectedProducts.splice(i,1);
  renderPage('new-order');
}
window.removeItem=function(i){ selectedProducts.splice(i,1); renderPage('new-order'); }

window.submitOrder=async function(){
  const customer=document.getElementById('no-customer')?.value?.trim();
  const phone=document.getElementById('no-phone')?.value?.trim();
  const shipping=document.getElementById('no-shipping')?.value;
  if(!customer){ toast('⚠ 請填入訂購人姓名'); return; }
  if(!phone){ toast('⚠ 請填入電話'); return; }
  if(!selectedProducts.length){ toast('⚠ 請至少選擇一項商品'); return; }
  
  const newId=genOrderId();
  const hasBuddha=selectedProducts.some(p=>!['手鍊','符管','周邊聖物','充電寶'].includes(p.category));
  const gift=document.getElementById('no-gift')?.value||'';
  const shippingDetail=document.getElementById('no-ship-detail')?.value||'';
  const note=document.getElementById('no-note')?.value||'';
  const staff=document.getElementById('no-staff')?.value||getStaff()[0];
  
  const order = {
    id:newId, date:new Date().toISOString().slice(0,10),
    customer, phone, shipping, shippingDetail, shipping_detail: shippingDetail,
    items:selectedProducts.map(p=>({productId:p.id,qty:p.qty})),
    gift, staff, source:newOrder.source||'門市', status:'待寄出', note
  };
  await DB.saveOrder(order);
  
  // Update stock
  for(const sp of selectedProducts){
    const p=getProductById(sp.id);
    if(p) await DB.updateStock(sp.id, Math.max(0,(p.stock||0)-sp.qty));
  }
  
  // Save customer
  await DB.saveCustomer({id:'C'+phone.replace(/-/g,''),name:customer,phone,shipping,shippingDetail});
  
  clearCache();
  selectedProducts=[];
  newOrder={ customer:'',phone:'',shipping:'',shippingDetail:'',items:[],gift:'',staff:'',source:'',note:'' };
  
  if(hasBuddha&&!gift) toast('⚠ 訂單建立！注意：未填佛牌鍊');
  else toast('✅ 訂單 #'+newId+' 建立成功！');
  navigateTo('orders');
}

// 加入 / 移除推薦清單
window.toggleRecommend = function(id) {
  const products = _cache.products || [];
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const i = recommendList.findIndex(r=>r.id===id);
  if(i>=0) { recommendList.splice(i,1); toast('已從推薦清單移除'); }
  else { recommendList.push(p); toast(`✓ 已加入推薦清單（${recommendList.length}件）`); }
  renderPage('filter');
};

window.addAllToRecommend = async function() {
  const allProducts = await getProducts();
  const results = allProducts.filter(p=>{
    if(filterState.cats.length && !filterState.cats.includes(p.category)) return false;
    if(filterState.effects.length && !filterState.effects.some(e=>(p.effects||[]).includes(e))) return false;
    if(filterState.type!=='不限' && p.type!==filterState.type) return false;
    if(filterState.budgetMin && p.price<parseInt(filterState.budgetMin)) return false;
    if(filterState.budgetMax && p.price>parseInt(filterState.budgetMax)) return false;
    return true;
  });
  results.forEach(p=>{ if(!recommendList.some(r=>r.id===p.id)) recommendList.push(p); });
  toast(`✓ 已加入 ${results.length} 件至推薦清單`);
  renderPage('filter');
};

// 產生推薦訊息文字
function buildRecommendText(style) {
  if(!recommendList.length) return '';
  const header = style==='formal'
    ? `🏮 佛牌殿 為您精選推薦\n${'═'.repeat(22)}\n`
    : `🏮 根據您的需求，為您推薦以下佛牌 ✨\n\n`;

  const items = recommendList.map((p,i)=>{
    const effects = (p.effects||[]).slice(0,3).join('、');
    const typeTag = p.type==='陰牌' ? '【陰牌】' : '【正牌】';
    if(style==='formal'){
      return `${i+1}. ${p.name}\n   ${typeTag} · ${p.master||''} · ${p.year||''}年製\n   功效：${effects||'—'}\n   售價：$${p.price.toLocaleString()}\n`;
    } else {
      return `✦ ${p.name}\n  ${typeTag} ${effects?'｜ '+effects:''}\n  💰 $${p.price.toLocaleString()}\n`;
    }
  }).join('\n');

  const footer = style==='formal'
    ? `\n${'─'.repeat(22)}\n有任何問題歡迎詢問 🙏`
    : `\n有興趣的話歡迎跟我們說 🙏\n可依需求進一步介紹！`;

  return header + items + footer;
}

window.saveNewProduct=async function(){
  const name=document.getElementById('np-name')?.value?.trim();
  const price=parseInt(document.getElementById('np-price')?.value);
  const cat=document.getElementById('np-cat')?.value;
  if(!name){ toast('⚠ 請填入商品名稱'); return; }
  if(!price||isNaN(price)){ toast('⚠ 請填入售價'); return; }
  if(!cat||cat==='__new__'){ toast('⚠ 請選擇種類'); return; }
  
  const type=document.getElementById('np-pos')?.classList.contains('on')?'正牌':'陰牌';
  const master=document.getElementById('np-master')?.value||'';
  const year=document.getElementById('np-year')?.value||new Date().getFullYear().toString();
  const stock=parseInt(document.getElementById('np-stock')?.value)||1;
  const material=document.getElementById('np-material')?.value||'';
  const feature=document.getElementById('np-feature')?.value||'';
  const effects=[...document.querySelectorAll('#np-effects .chip.on')].map(c=>c.textContent);
  const photoFile=document.getElementById('np-photo-file');
  
  // 上傳圖片
  let imageUrl = '';
  if(photoFile?.files?.[0]){
    toast('⏳ 圖片上傳中...');
    imageUrl = await DB.uploadImage(photoFile.files[0]) || '';
  }
  
  const catCode=cat.substring(0,2).toUpperCase();
  const allProds = await getProducts();
  const sameCode=allProds.filter(p=>(p.code||'').startsWith(catCode)).length+1;
  const code=`${catCode}${year}-${String(sameCode).padStart(3,'0')}`;
  
  const ok = await DB.saveProduct({ id:catCode+Date.now(), code, category:cat, name, type, master, year, stock, price, effects, material, feature, image:imageUrl, image_url:imageUrl });
  
  clearCache('products');
  _closeModal(); 
  if(ok) toast('✅ 商品建檔成功！'); 
  else toast('❌ 建檔失敗，請重試');
  renderPage('products');
}

// ============ REPORT ============
async function renderReport(){
  const orders = await getOrders();
  const months = ['10月','11月','12月','1月'];
  const monthSales = [72000, 89000, 104000, 128400];
  const maxSale = Math.max(...monthSales);
  
  const barsHTML = months.map((m,i)=>`
    <div class="bar-col">
      <div class="bar-val-t${i===3?' curr':''}">${monthSales[i]>=1000?Math.round(monthSales[i]/1000)+'k':monthSales[i]}</div>
      <div class="bar${i===3?' curr':''}" style="height:${Math.round(monthSales[i]/maxSale*80)}px;"></div>
      <div class="bar-lbl">${m}</div>
    </div>`).join('');
  
  const sourceMap = {};
  orders.forEach(o=>{ sourceMap[o.source]=(sourceMap[o.source]||0)+1; });
  const total=orders.length||1;
  const srcColors=['#d4a843','#3d7ac8','#2d8a5a','#c8553d'];
  const srcList=SOURCE_LIST.map((s,i)=>({ name:s, pct:Math.round((sourceMap[s]||0)/total*100), color:srcColors[i] }));
  
  const sourceHTML=srcList.map(s=>`
    <div class="source-item">
      <div class="source-dot" style="background:${s.color};"></div>
      <div class="source-name">${s.name}</div>
      <div class="source-pct">${s.pct}%</div>
    </div>`).join('');
  
  const rankMap={};
  orders.forEach(o=>o.items.forEach(it=>{ const p=getProductById(it.productId); if(p){ rankMap[p.category]=(rankMap[p.category]||0)+p.price*it.qty; } }));
  const ranking=Object.entries(rankMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const rankHTML=ranking.map((r,i)=>`<div class="rank-item"><div class="rank-num${i===0?' r1':''}">${i+1}</div><div class="rank-name">${r[0]}</div><div class="rank-sales">$${r[1].toLocaleString()}</div></div>`).join('');
  
  const staffMap={};
  orders.forEach(o=>{ staffMap[o.staff]=(staffMap[o.staff]||0)+o.items.reduce((s,it)=>{ const p=getProductById(it.productId); return s+(p?p.price*it.qty:0); },0); });
  const staffRank=Object.entries(staffMap).sort((a,b)=>b[1]-a[1]);
  const staffHTML=staffRank.map((r,i)=>`<div class="rank-item"><div class="rank-num${i===0?' r1':''}">${i+1}</div><div class="rank-name">${r[0]}</div><div class="rank-sales">$${r[1].toLocaleString()}</div></div>`).join('');

  return `
    <div class="chart-wrap">
      <div class="sec" style="margin:0 0 14px;">月銷售趨勢</div>
      <div class="bars">${barsHTML}</div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:0 0 12px;">客戶來源分析</div>
      <div class="source-legend">${sourceHTML}</div>
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:12px 0 8px;">商品銷售排行</div>
      ${rankHTML||'<div style="font-size:13px;color:var(--text3);padding:8px 0;">暫無資料</div>'}
    </div>
    <div style="background:var(--white);border-radius:var(--radius);padding:4px 14px;margin-bottom:10px;border:1px solid rgba(26,10,46,0.06);">
      <div class="sec" style="margin:12px 0 8px;">接單人員業績</div>
      ${staffHTML||'<div style="font-size:13px;color:var(--text3);padding:8px 0;">暫無資料</div>'}
    </div>
    <div style="height:20px;"></div>`;
}

// ============ NOTIFICATIONS ============
window.showNotif=async function(){
  const orders=await getOrders();
  const alerts=[];
  orders.filter(o=>o.status==='待寄出'||o.status==='待選鍊子').forEach(o=>{
    const noGift=o.items.some(it=>{ const p=getProductById(it.productId); return p&&!['手鍊','符管','周邊聖物','充電寶'].includes(p.category); })&&!o.gift;
    if(noGift) alerts.push(`<div style="padding:10px 0;border-bottom:1px solid rgba(26,10,46,0.06);font-size:13px;">⚠️ ${o.customer} #${o.id}<br><span style="color:var(--text3);font-size:12px;">未填佛牌鍊，請確認</span></div>`);
  });
  openModal(`<div class="modal-title">🔔 待處理提醒</div>${alerts.join('')||'<div style="text-align:center;padding:20px;color:var(--text3);">暫無待處理提醒</div>'}<button class="btn btn-secondary" style="width:100%;margin-top:14px;" onclick="_closeModal()">關閉</button>`);
}
