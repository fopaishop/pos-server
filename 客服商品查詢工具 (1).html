<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="佛牌殿·客服查詢">
<title>佛牌殿 · 客服商品查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --gold: #d4a843; --gold-light: #e8c97a; --gold-pale: #f5e9c8;
  --deep: #1a0a2e; --deep2: #2d1a4a;
  --surface: #f8f5f0; --surface2: #efe9de;
  --text: #1a0a2e; --text2: #6b5c7e; --text3: #9a8aab;
  --radius: 12px; --shadow: 0 2px 12px rgba(26,10,46,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Noto Sans TC',sans-serif;background:var(--deep);}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--surface);}
.topbar{background:var(--deep);padding:20px 16px 14px;flex-shrink:0;}
.topbar-title{font-family:'Noto Serif TC',serif;font-size:17px;color:var(--gold-light);font-weight:600;}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.cloud-status{font-size:11px;margin-top:8px;padding:6px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;}
.cloud-ok{background:rgba(120,200,150,0.15);color:#8fd6a8;}
.cloud-off{background:rgba(220,150,120,0.15);color:#e0a888;}
.search-wrap{padding:12px 16px;flex-shrink:0;background:var(--deep);}
.search-bar{position:relative;}
.search-bar input{width:100%;padding:12px 14px 12px 38px;border-radius:24px;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:14px;}
.search-bar input::placeholder{color:rgba(255,255,255,0.4);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:14px;}
.content{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
.hint{font-size:12px;color:var(--text3);text-align:center;padding:30px 20px;}
.card{background:#fff;border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(26,10,46,0.06);}
.card-img{width:100%;aspect-ratio:4/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:12px 14px;}
.card-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:2px;}
.card-meta{font-size:12px;color:var(--text3);margin-bottom:8px;}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--gold-pale);color:#8a6a1a;}
.row-bottom{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.price{font-family:'Noto Serif TC',serif;font-size:16px;color:var(--text);}
.stock{font-size:12px;padding:3px 9px;border-radius:20px;background:#eaf6ed;color:#2d7a4a;}
.stock.low{background:#fdece8;color:#c0392b;}
.btn-row{display:flex;gap:8px;}
.btn{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;}
.btn-copy{background:var(--deep);color:var(--gold-light);}
.btn-copy.copied{background:#2d7a4a;color:#fff;}
.btn-share{background:var(--surface2);color:var(--text2);}
.footer-note{font-size:11px;color:var(--text3);text-align:center;padding:10px 0 4px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-title">佛牌殿 · 客服商品查詢</div>
    <div class="topbar-sub">搜尋商品，一鍵複製介紹文字給客人</div>
    <div id="cloud-status" class="cloud-status cloud-off">尚未連接雲端資料庫</div>
  </div>
  <div class="search-wrap">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="輸入商品名稱、編號或種類..." oninput="onSearch(this.value)" autofocus>
    </div>
  </div>
  <div class="content" id="content">
    <div class="hint">請輸入關鍵字開始搜尋商品</div>
  </div>
</div>

<script>
// ============ 雲端連線設定（跟主 POS 系統填一樣的值）============
const SUPABASE_URL = 'https://roxwskdpnsctoaflcomt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJveHdza2RwbnNjdG9hZmxjb210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0Mjk3MDAsImV4cCI6MjEwNDAwNTcwMH0.CflNz8IOx85zo-apNjJkUBISqXYGVpu5-LJ5DDBPyxw';
const TENANT_ID = 'dbf9fcd3-110a-4dde-8ef9-40c2f89967a9';
const CLOUD_ENABLED = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_') && !TENANT_ID.startsWith('YOUR_');
const sb = CLOUD_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let allProducts = [];

async function loadProducts(){
  const statusEl = document.getElementById('cloud-status');
  if(!CLOUD_ENABLED){
    statusEl.textContent = '⚠ 尚未連接雲端資料庫（請填入 SUPABASE_URL / ANON_KEY / TENANT_ID）';
    statusEl.className = 'cloud-status cloud-off';
    return;
  }
  try{
    const { data, error } = await sb.from('products').select('*').eq('tenant_id', TENANT_ID).order('updated_at',{ascending:false});
    if(error) throw error;
    allProducts = data;
    statusEl.textContent = `✅ 已連接雲端，共 ${data.length} 項商品（即時同步）`;
    statusEl.className = 'cloud-status cloud-ok';
  }catch(e){
    console.error(e);
    statusEl.textContent = '⚠ 連線失敗，請檢查網路或設定';
    statusEl.className = 'cloud-status cloud-off';
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildIntroText(p){
  const lines = [
    `【${p.name}】`,
    `編號：${p.code}`,
    p.master ? `師傅/寺廟：${p.master}` : '',
    p.effects && p.effects.length ? `功效：${p.effects.join('、')}` : '',
    p.material ? `材料：${p.material}` : '',
    p.feature ? `特色：${p.feature}` : '',
    `價格：$${(p.price||0).toLocaleString()}`,
    `目前庫存：${p.stock > 0 ? p.stock + ' 件' : '缺貨中'}`,
  ];
  return lines.filter(Boolean).join('\n');
}

function renderResults(list){
  const content = document.getElementById('content');
  if(!list.length){
    content.innerHTML = `<div class="hint">找不到符合的商品</div>`;
    return;
  }
  content.innerHTML = list.map((p,i)=>`
    <div class="card">
      <div class="card-img" id="img-${i}">${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : '🏺'}</div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-meta">${escapeHtml(p.code)} · ${escapeHtml(p.master||'')}</div>
        <div class="tag-row">
          ${(p.effects||[]).slice(0,4).map(e=>`<span class="tag">${escapeHtml(e)}</span>`).join('')}
        </div>
        <div class="row-bottom">
          <span class="price">$${(p.price||0).toLocaleString()}</span>
          <span class="stock ${p.stock<=1?'low':''}">庫存：${p.stock}</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-copy" id="copy-${i}" onclick="copyIntro(${i}, this)">📋 複製介紹文字</button>
          ${p.image ? `<button class="btn btn-share" onclick="shareImage(${i})">🖼 分享照片</button>` : ''}
        </div>
      </div>
    </div>
  `).join('') + `<div class="footer-note">內容會即時同步雲端商品資料庫</div>`;
  window._currentList = list;
}

window.copyIntro=async function(i, btn){
  const p = window._currentList[i];
  const text = buildIntroText(p);
  try{
    await navigator.clipboard.writeText(text);
    const original = btn.textContent;
    btn.textContent = '✅ 已複製';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  }catch(e){
    alert('複製失敗，請手動選取：\n\n' + text);
  }
}

window.shareImage=async function(i){
  const p = window._currentList[i];
  if(!p.image) return;
  try{
    if(navigator.share && p.image.startsWith('data:')){
      const res = await fetch(p.image);
      const blob = await res.blob();
      const file = new File([blob], `${p.code}.jpg`, {type: blob.type});
      await navigator.share({ files:[file], title:p.name });
    }else{
      window.open(p.image, '_blank');
    }
  }catch(e){ console.error(e); }
}

let searchTimer;
window.onSearch=function(val){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    const q = val.trim();
    if(!q){ document.getElementById('content').innerHTML = `<div class="hint">請輸入關鍵字開始搜尋商品</div>`; return; }
    const results = allProducts.filter(p =>
      (p.name||'').includes(q) || (p.code||'').includes(q) || (p.category||'').includes(q) || (p.master||'').includes(q)
    );
    renderResults(results);
  }, 150);
}

loadProducts();
// 每次回到這個分頁（例如從 LINE 切回來）時自動重新抓一次最新資料
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadProducts(); });
</script>
</body>
</html>
